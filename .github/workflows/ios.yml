name: Build iOS (unsigned IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install
      - name: Cap sync
        run: npx cap sync ios
      - name: Build (device, no real signing)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" build
      - name: Package IPA (ad-hoc signed for Sideloadly)
        run: |
          cd ios/App
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          codesign --force --deep --sign - "$APP" || true
          rm -rf Payload App-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry App-unsigned.ipa Payload
          ls -la App-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mahjong-ios-ipa
          path: ios/App/App-unsigned.ipa
      - name: Zip Xcode project (ready to open: ios/ + node_modules/)
        run: |
          rm -rf ios/App/build ios/App/Payload ios/App/App-unsigned.ipa
          rm -f mahjong-xcode-project.zip
          zip -qry mahjong-xcode-project.zip ios node_modules
          ls -la mahjong-xcode-project.zip
      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: mahjong-ios-xcode-project
          path: mahjong-xcode-project.zip
