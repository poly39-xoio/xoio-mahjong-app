name: Sudoku iOS build & upload
on:
  workflow_dispatch:
  push:
    paths:
      - 'sudoku/**'
      - '.github/workflows/sudoku-ios.yml'
concurrency:
  group: sudoku-ios
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    env:
      TEAM_ID: M4G48H48SK
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        working-directory: sudoku
        run: npm install
      - name: Cap sync ios
        working-directory: sudoku
        run: npx cap sync ios
      - name: Pod install
        working-directory: sudoku/ios/App
        run: pod install --repo-update
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Prune stale signing certificates
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node scripts/prune_ios_certs.js
      - name: Archive
        working-directory: sudoku/ios/App
        env:
          KEYID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/App.xcarchive" -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_${KEYID}.p8 -authenticationKeyID "$KEYID" -authenticationKeyIssuerID "$ISSUER" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic archive
      - name: Export IPA
        working-directory: sudoku/ios/App
        env:
          KEYID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>M4G48H48SK</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$PWD/build/App.xcarchive" -exportPath "$PWD/build/ipa" -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_${KEYID}.p8 -authenticationKeyID "$KEYID" -authenticationKeyIssuerID "$ISSUER"
          ls -la "$PWD/build/ipa"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-appstore-ipa
          path: sudoku/ios/App/build/ipa/*.ipa
          if-no-files-found: warn
      - name: Upload to App Store Connect
        working-directory: sudoku/ios/App
        env:
          KEYID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(find build/ipa -maxdepth 1 -name '*.ipa' | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEYID" --apiIssuer "$ISSUER" --verbose
