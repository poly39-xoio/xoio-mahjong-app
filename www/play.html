<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>麻將 · 練習</title>
<style>
@font-face{font-family:'Huninn';src:url('fonts/Huninn.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url('fonts/Inter-latin.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('fonts/JetBrainsMono-latin.woff2') format('woff2');font-weight:400 800;font-style:normal;font-display:swap}
:root {
  --bg-body:#41341f; --bg-card:#2b2214; --bg-element:#382c1a;
  --border:#5a4726; --primary:#2ad49e; --primary-glow:rgba(42,212,158,.4);
  --danger:#f23645; --warning:#e0af68; --muted:#848e9c;
  --text-main:#f0f4f8; --text-sub:#848e9c;
  --font-ui:'Campton','Avenir Next','Montserrat','Huninn',sans-serif; --font-num:'Campton','Avenir Next','Montserrat','Huninn',monospace;
  --gold:#ffd700; --bg-header:#241b0e; --bg-hover:#382c1a;
  --tile-w:56px; --tile-h:80px;
  --tile-w-sm:26px; --tile-h-sm:37px;
  --my-flowers-maxh:0px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html[lang="ja"]{--font-ui:'Campton','Avenir Next','Montserrat','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif;--font-num:'Campton','Avenir Next','Montserrat','Hiragino Kaku Gothic ProN',sans-serif}
html[lang="ko"]{--font-ui:'Campton','Avenir Next','Montserrat','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Nanum Gothic',sans-serif;--font-num:'Campton','Avenir Next','Montserrat','Apple SD Gothic Neo',sans-serif}
body{background:var(--bg-body);color:var(--text-main);font-family:var(--font-ui);min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1,h2,h3,h4,button{font-family:var(--font-ui);text-transform:none;letter-spacing:.5px}
.num{font-family:var(--font-num)}
.main{display:flex;flex-direction:column;gap:16px;padding:16px;width:100%;max-width:1240px;margin:0 auto;min-height:100vh}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.card h3{font-size:16px;color:var(--muted);margin-bottom:14px;font-weight:700}
 .btn{width:100%;border:none;border-radius:14px;padding:17px;font-size:17px;font-weight:800;cursor:pointer;color:#04120c;background:linear-gradient(135deg,var(--primary) 0%,#00b894 100%);transition:.2s;text-transform:none;letter-spacing:1px}
.btn:disabled{background:#333;color:#666;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text-main);border:1px solid var(--border)}
.btn.ghost:not(:disabled):hover{border-color:var(--primary);color:var(--primary)}
.btn:not(:disabled):active{box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
 .btn.sm{padding:12px;font-size:15px;border-radius:10px}

/* lobby */
.stake-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stake{border:1px solid var(--border);border-radius:12px;padding:12px 6px;text-align:center;background:var(--bg-element);cursor:pointer;transition:.15s}
.stake b{display:block;font-size:19px;font-family:var(--font-num);color:var(--text-main)}
.stake small{color:var(--muted);font-size:10px}
.stake.sel{border-color:var(--primary);box-shadow:0 0 12px var(--primary-glow)}
.stake.sel b{color:var(--primary)}
 .buyin-info{display:flex;justify-content:space-between;font-size:15px;color:var(--text-sub);background:var(--bg-element);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.buyin-info b{color:var(--gold);font-family:var(--font-num)}
 .fee-note{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.seats{display:flex;justify-content:center;gap:10px;margin:6px 0 14px}
.seat{width:52px;text-align:center}
.seat .av{width:44px;height:44px;border-radius:50%;margin:0 auto 5px;border:2px solid var(--border);background:var(--bg-element);display:flex;align-items:center;justify-content:center;font-size:16px}
.seat .nm{font-size:9px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.seat.filled .av{border-color:var(--primary)}
.seat.you .av{border-color:var(--gold)}
.custom-box{display:none;background:var(--bg-element);border:1px dashed var(--border);border-radius:12px;padding:12px;margin-bottom:14px;gap:10px}
.custom-box.on{display:flex;flex-wrap:wrap;align-items:flex-end}
.custom-box label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px}
.custom-box input{background:var(--bg-body);border:1px solid var(--border);border-radius:8px;color:var(--text-main);padding:9px 10px;font-size:16px;font-family:var(--font-num);width:100%}
.custom-box input:focus{outline:none;border-color:var(--primary)}
.custom-saved{width:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:8px;margin-top:2px}
.custom-saved .h{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:700}
.cs-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:4px 8px;margin:2px 4px 2px 0;font-size:13px;cursor:pointer;background:var(--bg-element);font-family:var(--font-num)}
.cs-chip.sel{border-color:var(--primary);color:var(--primary);box-shadow:0 0 8px var(--primary-glow)}
.cs-chip .x{color:var(--danger);font-weight:900;padding-left:4px;cursor:pointer}
#btn-custom-add{width:100%;margin-top:6px}
.hidden{display:none!important}

/* ===== 分頁（進入牌桌後） ===== */
.tabs{display:flex;gap:8px;margin:4px 0 10px}
.tab-btn{flex:1;padding:12px 0;border:1px solid var(--border);border-radius:12px;background:var(--bg-element);color:var(--muted);font-size:16px;font-weight:800;cursor:pointer;letter-spacing:1px;transition:.2s;text-transform:none}
.tab-btn.on{border-color:var(--primary);color:var(--primary);box-shadow:0 0 12px var(--primary-glow)}
.tab-pg{display:none}
.tab-pg.on{display:block}

/* ===== 牌桌 ===== */
#view-table{position:relative}
.table-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px;flex-wrap:wrap}
.round-info{font-size:14px;color:var(--muted)}
.lang-fab{position:static;height:38px;padding:0 16px;border-radius:22px;font-size:12.5px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-element);color:var(--text-main);font-size:11px;font-weight:800;cursor:pointer;font-family:var(--font-num);letter-spacing:.5px;transition:.2s}
.lang-fab:hover{border-color:var(--primary);color:var(--primary)}
.lang-menu{position:fixed;right:12px;bottom:64px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:2px;z-index:60;min-width:132px;box-shadow:0 12px 34px #0008}
.lang-menu.on{display:flex}
.lang-menu button{background:transparent;border:0;color:var(--text-main);font-size:14px;font-weight:700;padding:9px 14px;border-radius:8px;text-align:left;cursor:pointer;font-family:inherit}
.lang-menu button:hover{background:#ffffff12}
.round-info b{color:var(--primary);font-size:16px}
.streak-chip{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;letter-spacing:.5px;vertical-align:2px;cursor:help;animation:pulse 1.2s infinite}
.status-tape{text-align:center;font-size:15px;color:var(--warning);min-height:24px;padding:4px 0;font-weight:700}
/* 出牌倒數時鐘(玩家回合 15s / 吃碰槓決策 15s) */
.turn-clock{position:absolute;top:44px;right:8px;width:46px;height:46px;border-radius:50%;background:var(--bg-element);border:2px solid var(--primary);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;font-family:var(--font-num);z-index:60;box-shadow:0 2px 10px rgba(0,0,0,.4);line-height:1}
.turn-clock.warn{border-color:var(--danger);color:var(--danger);animation:pulse 1s infinite}
.turn-clock.hidden{display:none}
.table-area{position:relative;border:1px solid #5a4726;border-radius:16px;background:linear-gradient(180deg,#3a2e1a,#2b2214);min-height:660px;padding:10px;overflow:hidden}

/* opponents */
.opp-top{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:6px}
.opp{display:flex;flex-direction:column;align-items:center;gap:3px}
.opp .tag{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.opp .tag b{color:var(--text-main);font-weight:700}
 .opp .wind{font-size:15px;font-weight:900;color:var(--gold)}
 .opp .cnt{font-size:13px;font-family:var(--font-num);color:var(--text-sub)}
/* 2026-10-08 John: 當前出牌家 — 名牌綠底加強 + 河牌區一起亮 */
.opp.active .tag{background:rgba(42,212,158,.09);border-radius:9px;box-shadow:0 0 8px rgba(42,212,158,.25);outline:1px solid rgba(42,212,158,.5);outline-offset:2px;animation:turnPulse 1.5s ease-in-out infinite}
.opp.active .tag b{color:#2ad49e}
.opp.active .dot2{background:#2ad49e;box-shadow:0 0 6px rgba(42,212,158,.55)}
@keyframes turnPulse{0%,100%{box-shadow:0 0 5px rgba(42,212,158,.16)}50%{box-shadow:0 0 11px rgba(42,212,158,.38)}}
.river-slot.active{background:rgba(42,212,158,.055);outline:1.5px solid rgba(42,212,158,.48);outline-offset:-2px;animation:turnPulse 1.5s ease-in-out infinite}
.river-slot.active .rv-tag{color:#2ad49e}
 .dot2{width:9px;height:9px;border-radius:50%;background:#444}
.backrow{display:flex}
 .backrow .bk{width:20px;height:28px;background:linear-gradient(135deg,#2a3140,#1c212b);border:1px solid #3a4356;border-radius:3px;margin-left:-6px}
.backrow .bk:first-child{margin-left:0}
.meld-row{display:flex;min-height:22px;gap:2px;flex-wrap:wrap;justify-content:center}
.opp-side{position:absolute;top:78px;display:flex;flex-direction:column;align-items:center;gap:4px}
.opp-side.left{left:6px;height:100%}
.opp-side.left .tag{position:relative;top:calc(50% - 158px);z-index:3} /* 2026-10-10 John: 西名字牌下移到西河牌區旁;蓋牌不動 */
.opp-side.right{right:6px}
.opp-side .backrow{flex-direction:column}
.opp-side .backrow .bk{margin:0 0 -8px 0}
.opp-side .meld-row{flex-direction:column}

/* river */
.river-area{position:absolute;left:56px;right:56px;top:70px;bottom:230px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.river-slot{background:rgba(255,255,255,.03);border-radius:8px;padding:16px 4px 4px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px;overflow:hidden;position:relative}
.river-slot .rv-tag{position:absolute;top:1px;left:4px;font-size:9px;color:var(--muted);font-weight:800;letter-spacing:.5px}
.river-slot .rt{min-width:24px;height:34px;background:#e8ecf2;border-radius:4px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111;font-weight:800;border:1px solid #bbb;cursor:default;line-height:1.15;padding:0 2px}
.river-slot .rt:last-child{outline:3px solid var(--primary);outline-offset:-1px}
.dealer-tag{position:absolute;top:52px;left:50%;transform:translateX(-50%);font-size:10px;background:var(--gold);color:#111;border-radius:20px;padding:2px 10px;font-weight:900;letter-spacing:1px;opacity:.9}

/* my area */
.my-area{position:absolute;left:6px;right:6px;bottom:6px;display:flex;flex-direction:column;align-items:center;gap:5px;background:rgba(255,255,255,.025);border-radius:10px;padding:5px 2px 3px}
.my-melds{display:flex;gap:4px;min-height:26px;align-items:center;flex-wrap:wrap;justify-content:center}
.meld-tile{min-width:20px;height:30px;background:#e8ecf2;color:#1a1a1a;border-radius:4px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #bbb;font-weight:800;line-height:1.1;padding:0 2px}
.my-melds .meld-tile{width:22px;height:32px;font-size:12px}
.my-hand{display:flex;align-items:flex-end;min-height:104px;padding:4px 2px;justify-content:center;overflow-x:auto;gap:3px;width:100%;max-width:100%;scrollbar-width:none;-ms-overflow-style:none}
.my-hand .tile{margin-left:0}
.my-hand::-webkit-scrollbar{display:none}

/* ===== 真實麻將牌面 ===== */
.tile{width:var(--tile-w);height:var(--tile-h);background:linear-gradient(160deg,#f7f8fb,#e2e6ee);border-radius:7px;border:1px solid #c4cad5;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s, box-shadow .12s;color:#1a1a1a;position:relative;box-shadow:0 2px 4px rgba(0,0,0,.4);flex-shrink:0;padding:3px 2px;user-select:none}
.my-hand .tile.sel{transform:translateY(-18px);box-shadow:0 0 12px var(--primary-glow);outline:2px solid var(--primary);outline-offset:-1px;z-index:3}
.my-hand .tile.sel.newtile{transform:translateY(-18px) scale(1.12)}
.tile.newtile{outline:3px solid var(--gold);outline-offset:-1px;z-index:5;transform:scale(1.12);box-shadow:0 0 16px rgba(255,215,0,.55);border-radius:8px}
.tile.face-down{background:linear-gradient(150deg,#1d2532,#10151d);border:1px solid #3a4356;cursor:default;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.tile.face-down .fd{font-size:20px;color:#4a5568;font-weight:900}
.tile:disabled{cursor:default}
.tile.dim{opacity:.35}

/* 萬子: 上中文數字 + 下「萬」字樣(仿真實萬子牌面) */
.tile.wan{background:linear-gradient(160deg,#f2f6ff,#dde6f7)}
.tile.wan .cn{font-size:27px;font-weight:900;color:#c0392b;line-height:1.1;font-family:'Noto Serif TC',serif}
.tile.wan .mk{font-size:13px;font-weight:900;color:#1f3f8f;line-height:1.1;font-family:'Noto Serif TC',serif;margin-top:1px;border:1px solid #1f3f8f55;border-radius:3px;padding:0 2px;background:#fff}
/* 筒子: 綠點, 依數字排真實點位(無數字) */
.tile.tong{background:linear-gradient(160deg,#f4fdf7,#ddf0e4)}
.tile.tong .g{display:grid;grid-template-columns:repeat(3,12px);grid-template-rows:repeat(3,12px);gap:1px}
.tile.tong .g i.u{background:radial-gradient(circle at 35% 30%,#7ed9a4,#1e8449 70%);border-radius:50%;box-shadow:inset 0 -1px 1px rgba(0,0,0,.25)}
/* 條子: 藍條, 依數字排(無數字) */
.tile.tiao{background:linear-gradient(160deg,#f2f6ff,#e0e8f8)}
.tile.tiao .g{display:grid;grid-template-columns:repeat(3,12px);grid-template-rows:repeat(3,14px);gap:1px}
.tile.tiao .g i.u{background:linear-gradient(90deg,#4a76d6,#2e5fb0);border-radius:2px;width:5px;height:14px;margin:0 auto;box-shadow:inset -1px 0 1px rgba(0,0,0,.2)}
/* 字牌/風牌 */
.tile.feng,.tile.jian,.tile.hua{font-size:30px;font-weight:900;font-family:'Huninn',sans-serif}
.tile.feng{background:linear-gradient(160deg,#fdf2f2,#f3dcdc)}
.tile.feng .n{color:#b22222}
.tile.jian{background:linear-gradient(160deg,#f7f7fa,#e6e6ee)}
.tile.jian.zhong .n{color:#c0392b}
.tile.jian.fa .n{color:#1e8449}
.tile.jian.bai .n{color:#555}
.tile.hua{background:linear-gradient(160deg,#fff6dc,#ffe9b0);border-color:#e0c060}
.tile.hua .n{color:#a07010}

/* 明牌檢視分頁: 四家完整攤開 */
#pg-reveal{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:14px}
.rv-head{font-size:13px;color:var(--muted);text-align:center;margin-bottom:10px;letter-spacing:1px}
.rv-row{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.rv-row:last-child{border-bottom:none}
.rv-wind{min-width:56px;font-size:16px;font-weight:900;color:var(--gold);text-align:center;border:1px solid var(--border);border-radius:10px;padding:8px 4px;background:var(--bg-element);text-transform:none}
.rv-tiles{display:flex;flex-wrap:wrap;gap:4px;align-items:center;flex:1}
.rv-flowers{display:flex;align-items:center;gap:3px;width:100%;padding-left:64px}
.rv-tiles .tile{cursor:default;width:56px;height:80px}
.rv-tiles .tile .cn{font-size:30px}
.rv-tiles .tile.feng,.rv-tiles .tile.jian,.rv-tiles .tile.hua{font-size:36px}
.rv-tiles .tile .mk{font-size:15px}
.rv-tiles .tile.wan .g,.rv-tiles .tile.tong .g,.rv-tiles .tile.tiao .g{transform:scale(1.15)}


/* ===== 圖示牌面 v2: 筒=圓點 條=直紋 萬=中文數字+萬字樣 ===== */
.tile.wan,.tile.tong,.tile.tiao{display:flex;flex-direction:column;align-items:center;justify-content:center}
.tile .g{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%;padding:6px 4px 4px}
.tile .g i{display:block;position:relative}
.tile.tong .g i.u{width:76%;height:76%;margin:12% auto;background:radial-gradient(circle at 35% 30%,#9fe0b8,#1e8449 75%);border-radius:50%;box-shadow:inset 0 -2px 2px rgba(0,0,0,.25)}
.tile.tiao .g i.u{width:44%;height:88%;margin:6% auto;background:linear-gradient(90deg,#5b86e0,#2e5fb0);border-radius:2px;box-shadow:inset -2px 0 2px rgba(0,0,0,.18)}
.tile .g i.u::after{content:'';position:absolute;left:0;right:0;top:0;bottom:0}
/* 迷你 tile (meld/river 用小圖示) */
.tile.sm{width:26px;height:37px;border-radius:4px;border-width:1px;padding:0;cursor:default;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.tile.sm .g{padding:2px 1px}
.tile.sm .cn{font-size:11px}
.tile.sm .mk{font-size:8px;margin-top:0}
.tile.sm .n{font-size:13px}
.river-slot .tile.sm{width:26px;height:37px}
.river-slot .tile.sm.newest{outline:2px solid #2ad49e;outline-offset:2px;border-radius:5px;box-shadow:0 0 7px 2px rgba(42,212,158,.6)}
.meld-row .tile.sm{width:26px;height:37px}
.my-melds .tile.sm{margin:0}
.my-melds .meld{display:flex;gap:2px}
/* 明牌檢視分頁 tile 完整攤開 */
.rv-row{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.rv-row:last-child{border-bottom:none}
.rv-wind{min-width:56px;font-size:16px;font-weight:900;color:var(--gold);text-align:center;border:1px solid var(--border);border-radius:10px;padding:8px 4px;background:var(--bg-element);text-transform:none}
.rv-tiles{display:flex;flex-wrap:wrap;gap:4px;align-items:center;flex:1}
.rv-flowers{display:flex;align-items:center;gap:3px;width:100%;padding-left:64px}
.rv-tiles .tile{width:56px;height:80px}

/* actions: 六顆按鈕(吃碰槓胡過出牌)樣式統一 */
.actions{display:flex;gap:6px;width:100%;max-width:560px;justify-content:center;margin-top:6px}
.actions .btn{flex:1;max-width:92px;padding:11px 0;font-size:16px;font-weight:700;border-radius:10px;letter-spacing:0;
  background:linear-gradient(160deg,#1b2430,#141b25);color:#cfd8e3;border:1px solid #3a4356;
  text-transform:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-family:var(--font-ui)}
.actions .btn:disabled{opacity:.55;cursor:not-allowed}
.actions .btn:not(:disabled):hover{border-color:var(--primary);color:#fff}
.actions .btn.actionable:disabled{opacity:1;background:rgba(42,212,158,.16);border-color:var(--primary);color:#7ff5d8}
.actions .btn.actionable{opacity:1}
/* 2026-10-08 John: 聽牌指示燈(放「吃」左邊), 聽牌就亮 */
.ting-chip{flex:0 0 auto;align-self:stretch;display:inline-flex;align-items:center;justify-content:center;padding:0 9px;border-radius:10px;font-size:12px;font-weight:900;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid rgba(42,212,158,.16);opacity:.5;transition:all .2s;cursor:default;user-select:none}
.ting-chip.on{color:#06231a;background:linear-gradient(135deg,#1fbf8b,#2ad49e);border-color:#2ad49e;opacity:1;box-shadow:0 0 12px rgba(42,212,158,.6);animation:tingPulse 1.3s ease-in-out infinite}
@keyframes tingPulse{0%,100%{box-shadow:0 0 8px rgba(42,212,158,.45)}50%{box-shadow:0 0 16px rgba(42,212,158,.85)}}
.action-flash{animation:flashin .3s}
@keyframes flashin{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

/* log */
.log-line{font-size:10px;color:var(--muted);padding:1px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
.logbox{max-height:110px;overflow-y:auto;background:var(--bg-element);border-radius:10px;padding:8px 10px;margin-top:10px}


/* ===== 真實麻將牌面 (SVG) ===== */
.tile.wan,.tile.tong,.tile.tiao{padding:0;overflow:hidden;background:#fff}
.tile.wan,.tile.tong,.tile.tiao{border:none;box-shadow:none}
.tile.wan .tileimg,.tile.tong .tileimg,.tile.tiao .tileimg{display:block;width:100%;height:100%;object-fit:cover;border-radius:6px}
.my-hand .tile.wan,.my-hand .tile.tong,.my-hand .tile.tiao{border:1px solid #c4cad5;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.rv-tiles .tile.wan,.rv-tiles .tile.tong,.rv-tiles .tile.tiao{border:1px solid #c4cad5;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.river-slot .tile.wan,.river-slot .tile.tong,.river-slot .tile.tiao,.meld-row .tile.wan,.meld-row .tile.tong,.meld-row .tile.tiao{border:1px solid #c4cad5}


/* 花牌區 */
.my-flowers{display:flex;gap:3px;min-height:26px;align-items:center;justify-content:center;flex-wrap:wrap}
.my-flowers .flw{font-size:11px;color:var(--gold);background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.35);border-radius:8px;padding:2px 8px;font-weight:800}
.my-flowers .flw img{width:20px;height:27px;vertical-align:middle;margin-right:3px;border-radius:3px}
.opp .flw{font-size:9px;color:var(--gold);margin-left:4px}
.btn.actionable{border-color:var(--primary)!important;color:var(--primary)!important;box-shadow:0 0 12px var(--primary-glow);animation:actpulse 1s infinite}
.btn.actionable:disabled{opacity:1;background:rgba(42,212,158,.15)}
@keyframes actpulse{0%,100%{box-shadow:0 0 6px var(--primary-glow)}50%{box-shadow:0 0 16px var(--primary-glow)}}

/* result modal */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;max-width:420px;width:100%;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.6);max-height:86vh;overflow-y:auto}
/* result: 攤牌卡 + 結算卡 兩張獨立卡片, 上下排列不互遮 */
.res-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:680px;margin:auto;max-height:calc(100vh - 40px);overflow-y:auto;padding:4px}
.res-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.6);width:100%}
.res-card-h{color:var(--gold);font-size:15px;font-weight:900;letter-spacing:2px;text-align:center;margin-bottom:6px}
#res-reveal{max-width:680px;text-align:center;border-color:var(--gold)}
#res-reveal .hu-hint{margin:2px 0 8px}
.res-card-settle{max-width:520px}
.res-card-settle h2{color:var(--gold);text-align:center}
.res-card-settle .sub{text-align:center;color:var(--muted)}
#hu-win-tile{display:flex;justify-content:center;margin:4px 0 0}
#hu-win-tile .tile{width:46px;height:66px;outline:3px solid var(--gold);outline-offset:1px;box-shadow:0 0 26px rgba(255,215,0,.9);border-radius:9px;animation:huFly .6s cubic-bezier(.25,1.2,.35,1) both}
@keyframes huFly{0%{transform:translateY(120px) translateX(0) scale(.4) rotate(-8deg);opacity:0}55%{transform:translateY(-16px) scale(1.08) rotate(3deg);opacity:1}100%{transform:translateY(0) scale(1) rotate(0)}}

#chi-mask .btn{width:auto;padding:8px 10px;font-size:13px;display:inline-flex;align-items:center;gap:2px;border-radius:10px}
#chi-mask .btn .tile{width:30px;height:43px;pointer-events:none}
#chi-opts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
.backrow.revealed{display:flex;gap:1px}
.backrow.revealed .tile{width:22px;height:31px}
.hu-hint{color:var(--gold);font-size:14px;font-weight:900;margin:2px 0 8px;letter-spacing:1px}
.hu-hand{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;background:rgba(255,255,255,.05);border-radius:10px;padding:8px;margin-top:4px;max-height:150px;overflow-y:auto}
/* 北方位(上方)吃碰牌移到蓋牌側邊, 不佔牌桌中央 */
#opp-top{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:8px;row-gap:3px}
#opp-top .backrow{order:0}
#opp-top .meld-row{order:1;flex-wrap:nowrap;justify-content:flex-start}
#opp-top .meld-row .meld{display:flex;flex-direction:row;align-items:center;gap:2px}
#opp-top .tag{order:2;flex:1 0 100%;justify-content:center;margin-top:2px}
.opp.hu-seat{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 22px rgba(255,215,0,.75);border-radius:10px;animation:actpulse 1s infinite}
.hu-hand .tile{width:34px;height:49px}
.hu-hand .tile.feng .n,.hu-hand .tile.jian .n{font-size:16px}
.hu-hand .tile .n{font-size:15px}
.hu-hand .tile.hu-win{outline:3px solid var(--gold);outline-offset:1px;box-shadow:0 0 14px rgba(255,215,0,.6)}
.modal h2{font-size:17px;text-align:center;margin-bottom:4px}
.modal .sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:14px}
.win-big{font-size:34px;text-align:center;margin:6px 0 10px;font-weight:900}
.tai-table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}
.tai-table td,.tai-table th{border-bottom:1px solid var(--border);padding:5px 8px}
#res-table td,#res-table th{padding:5px 8px;font-size:14px}
.tai-table th{color:var(--muted);text-align:left;font-weight:600;font-size:11px;text-transform:none}
.tai-table .num{text-align:right}
.tai-table .unit{font-family:var(--font-ui)}
.total-row td{border-top:2px solid var(--border);border-bottom:none;font-weight:900;font-size:16px;padding-top:10px}
.gold{color:var(--gold)}
.green{color:var(--primary)}
.red{color:var(--danger)}
.muted{color:var(--muted)}
.small{font-size:11px}

  .actions{gap:4px;margin-top:2px}

}

#btn-quit{background:rgba(21,27,33,.94);border:1px solid #ffffff30;color:#cfd6df;border-radius:22px;padding:10px 30px;font-size:13px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

<body>
<div id="bottom-bar"><button id="btn-quit" onclick="quitGame()">退出</button><button id="btn-lang" class="lang-fab" onclick="window.openLangMenu(event)">EN</button></div>
<div id="lang-menu" class="lang-menu">
  <button type="button" onclick="window.chooseLang('zh')">中文</button>
  <button type="button" onclick="window.chooseLang('en')">English</button>
  <button type="button" onclick="window.chooseLang('ja')">日本語</button>
  <button type="button" onclick="window.chooseLang('ko')">한국어</button>
</div>
<div class="main">

  <!-- ============ LOBBY ============ -->
  <div id="view-lobby" class="hidden">
    <div class="card">
      <h3>練習模式</h3>
      <div class="stake-grid" id="stake-grid"></div>

        <span>設定分數</span>

      </div>

        <label style="display:none">分數 = <b class="green" id="c-buy">500</b> U</label>

    <div class="tab-pg on" id="pg-game">

function tileKey(s,n){return s+'-'+n}
function tileName(t){
  if(t.s==='wan'||t.s==='tong'||t.s==='tiao'){
    const suit=(t.s==='wan'?'萬':t.s==='tong'?'筒':'條');
    return t.n+suit; // 例: 5萬
  }
  if(t.s==='feng') return (t.n===1?'東':t.n===2?'南':t.n===3?'西':'北');
  if(t.s==='jian') return JIAN[t.n-1];
  return HUA[t.n-1];
}
function tileNum(t){ return (t.s==='wan'||t.s==='tong'||t.s==='tiao') ? t.n : '' }

/* ================= 牌組 ================= */
function buildWall(){
  const w=[];
  for(const s of SUITS){ for(let n=1;n<=9;n++){ for(let i=0;i<4;i++) w.push({s,n,id:tileKey(s,n)+'-'+i}); } }
  for(let n=1;n<=4;n++){ for(let i=0;i<4;i++) w.push({s:'feng',n,id:'feng-'+n+'-'+i}); }
  for(let n=1;n<=3;n++){ for(let i=0;i<4;i++) w.push({s:'jian',n,id:'jian-'+n+'-'+i}); }
  for(let n=1;n<=8;n++) w.push({s:'hua',n,id:'hua-'+n});  // 花各1張
  return w;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ================= 胡牌判斷(示範:基本 5面子+1將 / 16張制簡化) ================= */
// cards 已排序; 判斷能否全部組成 melds 個面子
function canCompose(cards, melds){
  // cards 未排序也行; 統一以「剩餘牌陣列」遞迴, 每次處理最小一張
  const same=(a,b)=>a.s===b.s&&a.n===b.n;
  const isNum=t=>t.s==='wan'||t.s==='tong'||t.s==='tiao';
  function dfs(rem,left){
    if(left===0) return rem.length===0;
    if(rem.length===0) return false;
    const t=rem[0];
    // 嘗試刻子(排序下相同三張必相鄰)
    if(rem.length>=3 && same(t,rem[1]) && same(t,rem[2])){
      if(dfs(rem.slice(3),left-1)) return true;
    }
    // 嘗試順子: 以最小牌當開頭, 找 n+1, n+2
    if(isNum(t) && t.n<=7){
      let i2=-1,i3=-1;
      for(let i=1;i<rem.length;i++){
        if(rem[i].s===t.s&&rem[i].n===t.n+1){i2=i;break;}
      }
      for(let i=1;i<rem.length;i++){
        if(rem[i].s===t.s&&rem[i].n===t.n+2){i3=i;break;}
      }
      if(i2>=0&&i3>=0){
        const rest=rem.filter((_,i)=>i!==0&&i!==i2&&i!==i3);
        if(dfs(rest,left-1)) return true;
      }
    }
    return false;
  }
  const sorted=[...cards].sort((a,b)=>a.s===b.s?a.n-b.n:a.s.localeCompare(b.s));
  return dfs(sorted,melds);
}
function isWin(hand, openMelds){ // hand 手牌; openMelds 已亮出面子數(吃碰槓)
  // 台灣16張: 胡牌 = 5面子+1將(17張), 亮出 m 組面子後手牌需組成 (5-m)面子+1將
  openMelds=openMelds||0;
  const need=(5-openMelds);
  const wantLen=need*3+2;
  if(hand.length!==wantLen) return false;
  const sorted=[...hand].sort((a,b)=>a.s===b.s?a.n-b.n:a.s.localeCompare(b.s));
  for(let i=0;i<sorted.length-1;i++){
    if(sorted[i].s===sorted[i+1].s&&sorted[i].n===sorted[i+1].n){
      const rest=[...sorted.slice(0,i),...sorted.slice(i+2)];
      if(canCompose(rest,need)) return true;
    }
  }
  return false;
}

function canFormOnlyShun(cards){
  // 全牌只能組成順子(平胡輔助)
  const same=(a,b)=>a.s===b.s&&a.n===b.n;
  const isNum=t=>t.s==='wan'||t.s==='tong'||t.s==='tiao';
  function dfs(rem){
    if(rem.length===0) return true;
    const t=rem[0];
    if(!isNum(t)) return false;
    if(t.n<=7){
      let i2=-1,i3=-1;
      for(let i=1;i<rem.length;i++){ if(rem[i].s===t.s&&rem[i].n===t.n+1){i2=i;break;} }
      for(let i=1;i<rem.length;i++){ if(rem[i].s===t.s&&rem[i].n===t.n+2){i3=i;break;} }
      if(i2>=0&&i3>=0){
        const rest=rem.filter((_,k)=>k!==0&&k!==i2&&k!==i3);
        if(dfs(rest)) return true;
      }
    }
    return false;
  }
  return dfs([...cards].sort((a,b)=>a.s===b.s?a.n-b.n:a.s.localeCompare(b.s)));
}
function canFormGen(cards,m,p){
  // 通用拆解: m 組面子 + p 組將(0/1); 面子可刻可順
  const same=(a,b)=>a.s===b.s&&a.n===b.n;
  const isNum=t=>t.s==='wan'||t.s==='tong'||t.s==='tiao';
  const sorted=[...cards].sort((a,b)=>a.s===b.s?a.n-b.n:a.s.localeCompare(b.s));
  const memo=new Map();
  function dfs(rem,lm,lp){
    if(rem.length===0) return lm===0&&lp===0;
    const key=rem.map(x=>x.s+x.n).join(',')+'|'+lm+'|'+lp;
    if(memo.has(key)) return memo.get(key);
    const t=rem[0];
    let ok=false;
    // 取將
    if(lp>0&&rem.length>=2&&same(t,rem[1])){
      if(dfs(rem.slice(2),lm,0)) ok=true;
    }
    // 刻子
    if(!ok&&rem.length>=3&&same(t,rem[1])&&same(t,rem[2])){
      if(dfs(rem.slice(3),lm-1,lp)) ok=true;
    }
    // 順子
    if(!ok&&isNum(t)&&t.n<=7){
      let i2=-1,i3=-1;
      for(let i=1;i<rem.length;i++){ if(rem[i].s===t.s&&rem[i].n===t.n+1){i2=i;break;} }
      for(let i=1;i<rem.length;i++){ if(rem[i].s===t.s&&rem[i].n===t.n+2){i3=i;break;} }
      if(i2>=0&&i3>=0){
        const rest=rem.filter((_,k)=>k!==0&&k!==i2&&k!==i3);
        if(dfs(rest,lm-1,lp)) ok=true;
      }
    }
    memo.set(key,ok);
    return ok;
  }
  return dfs(sorted,m,p);
}
function isAllKong(cards,kongs){
  // 面子全部必須是刻(碰碰胡/五暗刻輔助): cards = 手牌(不含 meld), kongs = 需補的刻組數
  const same=(a,b)=>a.s===b.s&&a.n===b.n;
  const sorted=[...cards].sort((a,b)=>a.s===b.s?a.n-b.n:a.s.localeCompare(b.s));
  function dfs(rem,left){
    if(rem.length===0) return left===0;
    if(rem.length>=3&&same(rem[0],rem[1])&&same(rem[0],rem[2])){
      if(dfs(rem.slice(3),left-1)) return true;
    }
    return false;
  }
  for(let i=0;i<sorted.length-1;i++){
    if(same(sorted[i],sorted[i+1])){
      const rest=[...sorted.slice(0,i),...sorted.slice(i+2)];
      if(dfs(rest,kongs)) return true;
    }
  }
  return false;
}
function countWinWays(hand17, winTile){
  // 數 winTile 能「歸位」成胡的方法數: 1 = 獨聽(中洞/邊張/單吊)
  const same=(a,b)=>a.s===b.s&&a.n===b.n;
  const isNum=t=>t.s==='wan'||t.s==='tong'||t.s==='tiao';
  const rest=hand17.filter(x=>!(x.s===winTile.s&&x.n===winTile.n)); // 移一張 winTile
  let ways=0;
  // 1) 當將: 找另一張同牌
  let pairIdx=-1;
  for(let i=0;i<rest.length;i++){ if(same(rest[i],winTile)){pairIdx=i;break;} }
  if(pairIdx>=0){
    const r2=rest.filter((_,k)=>k!==pairIdx);
    if(canFormGen(r2,4,0)) ways++; // 其餘 15張? 17-2=15 -> 5面子? 錯
  }
  return ways;
}
function isUniqueWait(hand, openMelds, winTile){
  // 獨聽 = 整手(暗牌)只聽一張: 枚舉 34 種牌面, 能胡的只有 1 種且就是 winTile
  // 中洞/邊張/單吊皆符合; 雙頭/三頭聽 2 張以上不算(John 2026-09-08 定案)
  const idx=hand.findIndex(x=>x.s===winTile.s&&x.n===winTile.n); // 只移一張(單吊時手牌可能有多張同值)
  if(idx<0) return false;
  const rest=[...hand.slice(0,idx),...hand.slice(idx+1)];
  const m=openMelds||0;
  let winKinds=0, winKey='';
  const cands=[];
  for(const s of ['wan','tong','tiao']) for(let n=1;n<=9;n++) cands.push({s,n});
  for(let n=1;n<=4;n++) cands.push({s:'feng',n});
  for(let n=1;n<=3;n++) cands.push({s:'jian',n});
  for(const c of cands){
    if(isWin([...rest,{s:c.s,n:c.n,id:'probe'}], m)){
      winKinds++;
      winKey=c.s+c.n;
      if(winKinds>1) return false;   // 聽超過一張 → 非獨聽
    }
  }
  return winKinds===1 && winKey===winTile.s+winTile.n;
}

function calcTai(hand, selfDraw, isDealer, seatIdx, roundWindIdx, streak, melds, flowers, meldTiles, winTile, discarderIsDealer, ctx){
  // 依 mahjongtw.com 台數表為標準(John 2026-09-08 定案)。與後端引擎 calcTai 相同規則。
  ctx=ctx||{};
  const all=[...hand, ...(meldTiles||[])];
  const t={};
  for(const x of all){const k=tileKey(x.s,x.n);t[k]=(t[k]||0)+1;}
  const cnt=(s,n)=>t[tileKey(s,n)]||0;
  const meldArr=melds||[];
  const hasChi=meldArr.some(m=>m.type==='chi');
  const flowersArr=flowers||[];
  let tai=0;
  const breakdown=[];
  const seatWindName=seatWind(seatIdx);
  const WIND_SEQ=['東','南','西','北'];
  const windIdx=WIND_SEQ.indexOf(seatWindName); // 0東1南2西3北
  const roundWind=['東','南','西','北'][Math.max(0,Math.min(3,roundWindIdx|0))]; // 圈風:支援東南西北四圈(一將)
  const fengNo=w=>w==='東'?1:w==='南'?2:w==='西'?3:4;
  const hasHonor=all.some(x=>x.s==='feng'||x.s==='jian');
  // 牌張計數
  const jianC=[cnt('jian',1),cnt('jian',2),cnt('jian',3)];
  const fengC=[1,2,3,4].map(n=>cnt('feng',n));
  const jianTri=jianC.filter(c=>c>=3).length;
  const fengTri=fengC.filter(c=>c>=3).length;
  const jianPair=jianC.some(c=>c===2);
  const fengPair=fengC.some(c=>c===2);
  const suits=new Set(all.filter(x=>x.s==='wan'||x.s==='tong'||x.s==='tiao').map(x=>x.s));
  // 花
  let zhen=0; flowersArr.forEach(f=>{ if(((f.n-1)%4)===windIdx) zhen++; });

  // 情境大牌: 天胡/地胡/人胡 16 台(不與自摸/門清/不求/天聽/地聽疊)
  const sTianHu=!!ctx.tianHu, sDiHu=!!ctx.diHu, sRenHu=!!ctx.renHu;
  const sTianTing=!!ctx.tianTing, sDiTing=!!ctx.diTing;
  const big16=sTianHu||sDiHu||sRenHu;
  // 門清: 網站定義 = 無吃、碰、明槓(暗槓不破門清)
  const noMeldsExceptAnGang=meldArr.every(m=>m.type==='angang');
  // 平胡/全求: 網站平胡 = 無任何吃碰槓
  const anyMeld=meldArr.length>0;

  // 花胡: 集滿 8 張花直接胡 (算 8 台, 八仙過海)
  if(flowersArr.length>=8){
    return {tai:8, breakdown:[{name:'八仙過海(花胡)',tai:8}]};
  }
  // ---- 基本 1台項(獨立可疊; 情境大牌排除) ----
  if(selfDraw && !sTianHu && !sDiHu){tai+=1;breakdown.push({name:'自摸',tai:1})}
  if(isDealer){tai+=1;breakdown.push({name:'莊家',tai:1})}
  else if(discarderIsDealer){tai+=1;breakdown.push({name:'莊家放炮',tai:1})}
  if(noMeldsExceptAnGang && !big16 && !sTianTing && !sDiTing){tai+=1;breakdown.push({name:'門清',tai:1})}
  // 不求(網站): 沒吃碰就自摸 → 門清自摸共 3 台(門清+自摸+不求)
  if(selfDraw && noMeldsExceptAnGang && !big16 && !sTianTing && !sDiTing){tai+=1;breakdown.push({name:'不求',tai:1})}
  if(zhen>0){tai+=zhen;breakdown.push({name:'正花 ×'+zhen,tai:zhen})}
  // 情境 1台項
  if(ctx.gangShang){tai+=1;breakdown.push({name:'槓上開花',tai:1})}
  if(ctx.haiDi){tai+=1;breakdown.push({name:'海底撈月',tai:1})}
  if(ctx.heDi){tai+=1;breakdown.push({name:'河底撈魚',tai:1})}

  // ---- 獨聽(單吊/中洞/邊張擇一) / 全求人(放槍) / 半求人(自摸) ----
  let isDu=false, isPing=false, isQuan=false;
  const hasWT=!!(winTile&&hand.some(x=>x.s===winTile.s&&x.n===winTile.n));
  const handTotal=hand.length+(winTile&&!hasWT?1:0);
  if(meldArr.length===4 && handTotal===2) isQuan=true;
  if(isQuan){
    if(selfDraw){ tai+=1; breakdown.push({name:'半求人',tai:1}); }
    else { tai+=2; breakdown.push({name:'全求人',tai:2}); }
  } else if(winTile && !big16){
    // 獨聽(不限門清): 整手(暗牌)只聽 winTile 一張 → 中洞/邊張/單吊; 雙頭/多聽不算
    if(isUniqueWait(hand, meldArr.length, winTile)){ isDu=true; tai+=1; breakdown.push({name:'獨聽',tai:1}); }
  }

  // ---- 平胡 2台(網站): 無吃碰槓、非自摸、無字無花無刻、非獨聽 ----
  if(!anyMeld && !selfDraw && flowersArr.length===0 && !hasHonor && !isDu && !big16){
    const srt=[...hand].sort((a,b)=>a.s===b.s?a.n-b.n:a.s.localeCompare(b.s));
    for(let i=0;i<srt.length-1;i++){
      if(srt[i].s===srt[i+1].s&&srt[i].n===srt[i+1].n){
        const rest=[...srt.slice(0,i),...srt.slice(i+2)];
        if(canFormOnlyShun(rest)){ isPing=true; break; }
      }
    }
    if(isPing){ tai+=2; breakdown.push({name:'平胡',tai:2}); }
  }

  // ---- 花色: 字一色 8 / 清一色 8 / 混一色 4(網站) ----
  if(suits.size===0 && hasHonor){ tai+=8; breakdown.push({name:'字一色',tai:8}); }
  else {
    if(suits.size===1&&!hasHonor){tai+=8;breakdown.push({name:'清一色',tai:8})}
    else if(suits.size===1&&hasHonor){tai+=4;breakdown.push({name:'混一色',tai:4})}
  }

  // ---- 三元牌(網站: 每坎各 1 台; 大三元/小三元擇優) ----
  if(jianTri===3){ tai+=8; breakdown.push({name:'大三元',tai:8}); }
  else if(jianTri===2 && jianPair){ tai+=4; breakdown.push({name:'小三元',tai:4}); }
  else if(jianTri>=1){ tai+=jianTri; breakdown.push({name:'三元牌 ×'+jianTri, tai:jianTri}); }

  // ---- 風牌(門風) / 風圈(圈風) 分開各 1 台(網站); 大四喜不疊風牌風圈 ----
  if(fengTri===4){ tai+=16; breakdown.push({name:'大四喜',tai:16}); }
  else {
    if(fengTri===3 && fengPair){ tai+=8; breakdown.push({name:'小四喜',tai:8}); }
    if(cnt('feng',fengNo(roundWind))>=3){ tai+=1; breakdown.push({name:'風圈',tai:1}); }
    if(cnt('feng',fengNo(seatWindName))>=3){ tai+=1; breakdown.push({name:'風牌',tai:1}); }
  }

  // ---- 暗刻: 三暗刻 2 / 四暗刻 5 / 五暗刻 8(網站) + 碰碰胡 4 ----
  let darkK=0;
  const handAll=[...hand];
  if(winTile && !hasWT) handAll.push(winTile);
  const ht={};
  for(const x of handAll){ const k=tileKey(x.s,x.n); ht[k]=(ht[k]||0)+1; }
  for(const k in ht) if(ht[k]>=3) darkK++;
  darkK+=meldArr.filter(m=>m.type==='angang').length;
  const pengGang=meldArr.filter(m=>m.type!=='chi');
  let isWuAn=false, isPengPeng=false;
  if(!hasChi){
    const needK=5-pengGang.length;
    if(needK>=0 && isAllKong(hand, needK)){
      const allAn=(meldArr.length===0||meldArr.every(m=>m.type==='angang'));
      const kongNeed=5-meldArr.filter(m=>m.type==='angang').length;
      if(allAn && kongNeed>=0 && isAllKong(hand,kongNeed)){ isWuAn=true; }
      else isPengPeng=true;
    }
  }
  if(isWuAn){ tai+=8; breakdown.push({name:'五暗刻',tai:8}); }          // 全暗 → 取代碰碰胡/四暗刻/三暗刻
  else if(darkK>=4){ tai+=5; breakdown.push({name:'四暗刻',tai:5}); }    // 蓋過碰碰胡(取高)
  else if(isPengPeng){ tai+=4; breakdown.push({name:'碰碰胡',tai:4}); }  // 碰碰胡 > 三暗刻(不疊)
  else if(darkK>=3){ tai+=2; breakdown.push({name:'三暗刻',tai:2}); }

  // ---- 情境聽牌: 天聽 8 / 地聽 4(不疊門清/不求, 已於上方排除) ----
  if(sTianTing){ tai+=8; breakdown.push({name:'天聽',tai:8}); }
  else if(sDiTing){ tai+=4; breakdown.push({name:'地聽',tai:4}); }
  if(sTianHu){ tai+=16; breakdown.push({name:'天胡',tai:16}); }
  else if(sDiHu){ tai+=16; breakdown.push({name:'地胡',tai:16}); }
  else if(sRenHu){ tai+=16; breakdown.push({name:'人胡',tai:16}); }

  // ---- 連莊: 連一拉一 => (streak-1)*2 台; 莊家放炮時照算(John 2026-09-08) ----
  if(isDealer && streak>1){
    const lz=(streak-1)*2;
    tai+=lz; breakdown.push({name:'連莊 ×'+(streak-1)+' (拉一)', tai:lz});
  }else if(discarderIsDealer && streak>1){
    const lz=(streak-1)*2;
    tai+=lz; breakdown.push({name:'連莊 ×'+(streak-1)+' 照算(莊家放炮)', tai:lz});
  }
  // John 2026-09-08 08:53: 屁胡 = 0 台(移除「基本台」兜底; 0 台只收底注)
  return {tai,breakdown};
}

let _AC=null;
function sfxInit(){ try{ if(!_AC){ _AC=new (window.AudioContext||window.webkitAudioContext)(); } if(_AC&&_AC.state==='suspended'){ _AC.resume(); } }catch(e){} }
function beep(f,d,type,vol,delay){
  if(!_AC) return;
  // suspended(手機常見: AudioContext 未解鎖) → 嘗試 resume 後照常排程, 不靜默放棄
  if(_AC.state==='suspended'){ try{ _AC.resume(); }catch(e){} }
  if(_AC.state==='closed') return;
  try{
    const t=_AC.currentTime+(delay||0);
    const o=_AC.createOscillator(), g=_AC.createGain();
    o.type=type||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.06,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(_AC.destination);
    o.start(t); o.stop(t+d+0.03);
  }catch(e){}
}

function fitMyHand(){
  const el=document.getElementById('my-hand');
  if(!el) return;
  const tiles=el.querySelectorAll('.tile');
  if(tiles.length<2) return;
  const avail=el.clientWidth-8;
  const n=tiles.length, gap=3;
  // 牌面上限由 CSS --tile-w 控制 (桌面 56 / 手機直立 48 / 橫向 34), 避免把牌縮成小不點
  const maxW=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile-w'))||56;
  // 手機直立(≤640 portrait)+ iPad 直立(≥760 portrait): 手牌分兩層(下層最多 8 張)
  if(matchMedia('(max-width:640px) and (orientation:portrait)').matches || matchMedia('(min-width:760px) and (orientation:portrait)').matches){
    const lower=Math.min(8,n);   // 下層固定最多 8 張
    const upper=n-lower;         // 上層 = 其餘, 出牌時先減少 → 直到上層歸零才動下層
    const maxRow=Math.max(upper,lower,1);
    let tw=Math.floor((avail-(maxRow-1)*gap)/maxRow);
    tw=Math.max(24, Math.min(maxW, tw));
    const th=Math.round(tw*80/56);
    el.style.gap=gap+'px';
    el.style.justifyContent='center';
    tiles.forEach(t=>{ t.style.width=tw+'px'; t.style.height=th+'px'; t.style.marginLeft=''; });
    // 強制斷行: 第 upper 張之後換行(上層 upper 張 / 下層 lower 張)
    el.querySelectorAll('.row-brk').forEach(b=>b.remove());
    if(upper>0&&lower>0&&el.children[upper]){
      const brk=document.createElement('div');
      brk.className='row-brk';
      brk.style.cssText='flex-basis:100%;width:100%;height:0;overflow:hidden';
      el.insertBefore(brk, el.children[upper]);
    }
    tiles.forEach(t=>{
      const nm=t.querySelector('.n');
      if(nm) nm.style.fontSize=Math.max(11,Math.round(tw*0.55))+'px';
      const cn=t.querySelector('.cn');
      if(cn) cn.style.fontSize=Math.max(10,Math.round(tw*0.5))+'px';
    });
    // 只剩一行(≤8張)時集中在下行, 不要跑上層(John 2026-09-08)
    el.style.alignContent=(upper>0)?'flex-start':'flex-end';
    return;
  }
  // 寬度足夠 → 標準排列(不重疊不縮小), 回歸 CSS 尺寸
  if(n*maxW+(n-1)*gap<=avail){
    el.style.gap='';
    el.style.justifyContent='center';
    tiles.forEach(t=>{ t.style.width=''; t.style.height=''; t.style.marginLeft=''; });
    return;
  }
  // 寬度不足 → 不重疊不縮小: 牌維持最大尺寸, 手牌改橫向滑動檢視
  const th=Math.round(maxW*80/56);
  el.style.gap=gap+'px';
  el.style.justifyContent='flex-start';
  tiles.forEach(t=>{ t.style.width=maxW+'px'; t.style.height=th+'px'; t.style.marginLeft=''; });
  // 字牌(風/箭/萬)文字跟隨縮放
  tiles.forEach(t=>{
    const nm=t.querySelector('.n');
    if(nm) nm.style.fontSize=Math.max(12,Math.round(maxW*0.55))+'px';
    const cn=t.querySelector('.cn');
    if(cn) cn.style.fontSize=Math.max(10,Math.round(maxW*0.5))+'px';
  });
}

/* ================= 示範 AI ================= */
function aiChooseDiscard(p){
  // 出「最沒用」的牌: 孤張(無對子/鄰居最少)優先丟; 保留刻子/對子/有鄰居
  // 丟牌 = score 最大者優先
  const hand=p.hand.slice().sort((a,b)=>a.s===b.s?a.n-b.n:a.s.localeCompare(b.s));
  let best=null,bestScore=-999;
  for(const t of hand){
    const same=hand.filter(x=>x.s===t.s&&x.n===t.n).length;
    let neighbor=0;
    if(t.s==='wan'||t.s==='tong'||t.s==='tiao'){
      if(hand.some(x=>x.s===t.s&&x.n===t.n+1))neighbor++;
      if(hand.some(x=>x.s===t.s&&x.n===t.n-1))neighbor++;
      if(hand.some(x=>x.s===t.s&&x.n===t.n+2))neighbor+=0.5;
      if(hand.some(x=>x.s===t.s&&x.n===t.n-2))neighbor+=0.5;
    }
    // 越孤張分數越高(先丟); 刻子/對子/有鄰居 分數低(保留)
    let score;
    if(same>=3) score=-5;          // 刻子絕不丟
    else if(same===2) score=-1;    // 對子保留
    else score = 3 - neighbor;     // 孤張 3 起, 有鄰居遞減
    if(score>bestScore){bestScore=score;best=t;}
  }
  return best||hand[hand.length-1];
}

async function deal(){
  stopTurnClock();
  G={wall:shuffle(buildWall()),players:[],drawTile:null,phase:'play',selected:null,lastDiscard:null,lastDiscarder:-1,askQueue:[],askTile:null,askFrom:-1,_discardsMade:0,_seatFirstDraw:[true,true,true,true],_seatFirstDrawTenpai:[false,false,false,false],_seatDiscards:[0,0,0,0],_dealerInitialTenpai:false,_curFirstDraw:false};
  for(let i=0;i<4;i++){G.players.push({hand:[],melds:[],river:[],hiddenCnt:16,name:(i===2?ME.name:AI_NAMES[i<2?i:i-1]),flowers:[]});}
  turn=dealer;
  renderWall();
  updateRoundLabel();
  document.getElementById('dealer-label').textContent=seatWind(dealer);
  document.getElementById('dealer-badge').classList.remove('hidden');
  document.getElementById('dealer-badge').textContent=tl('莊')+' '+seatWind(dealer);
  // John 2026-09-08: 莊家連莊提示(連莊台照算/閒家自摸莊家多付)
  const dsl=document.getElementById('dealer-streak-label');
  if(dealerStreak>1){
    const n=dealerStreak-1;
    dsl.textContent=tf('連莊 ×{n} 拉 {n}',{n:n});
    dsl.title='莊家連莊中:莊家胡牌台數加倍;莊家放炮/閒家自摸時,莊家須多付「莊家台+連莊台」';
    dsl.classList.remove('hidden');
  } else { dsl.classList.add('hidden'); }
  status('發牌中…');
  // 每局開始: 先清空上局殘留畫面, 牌全部蓋著
  for(let i=0;i<4;i++){
    if(i===2){
      const h=document.getElementById('my-hand'); if(h) h.innerHTML='';
      const mm=document.getElementById('my-melds'); if(mm) mm.innerHTML='';
      const mf=document.getElementById('my-flowers'); if(mf) mf.innerHTML='';
    }else{
      const cntEl=document.getElementById('opp-'+seatInfo(i).id+'-cnt'); if(cntEl) cntEl.textContent='0';
      renderBackRow(i,0);
      const om=document.getElementById('opp-'+seatInfo(i).id+'-meld'); if(om) om.innerHTML='';
    }
  }
  const ra=document.getElementById('river-area'); if(ra) ra.innerHTML='';
  const bd0=document.getElementById('btn-discard'); if(bd0){bd0.disabled=true;bd0.classList.remove('actionable');}
  // 發牌動作: 一次每人一疊4張, 共4疊(16張), 有節奏地發出
  const need=[0,0,0,0];
  for(let r=0;r<4;r++){
    for(let i=0;i<4;i++){
      let guard=0;
      while(need[i]<(r+1)*4 && G.wall.length && guard++<20){
        const t=G.wall.pop();
        if(t.s==='hua'){ G.players[i].flowers.push(t); continue; }
        G.players[i].hand.push(t); need[i]++;
      }
    }
    renderWall();
    // 逐疊更新牌背張數與自己的手牌
    for(let i=0;i<4;i++){
      if(i===2) continue;
      const cntEl=document.getElementById('opp-'+seatInfo(i).id+'-cnt');
      if(cntEl) cntEl.textContent=G.players[i].hand.length;
      renderBackRow(i,G.players[i].hand.length);
    }
    renderMyHandCover(need[2]); // 發牌中自己手牌蓋著(面朝下)
    sfx('dealTick');
    await sleep(AUTOPLAY?80:300);
  }
  // 補齊(牆若有剩但有人不足16時)
  for(let i=0;i<4;i++){
    while(need[i]<16 && G.wall.length){ const t=G.wall.pop(); if(t.s==='hua'){G.players[i].flowers.push(t);}else{G.players[i].hand.push(t);need[i]++;} }
  }
  G.players.forEach((p,i)=>{ if(p.flowers.length){ log(seatWind(i)+'家 起手花牌 '+p.flowers.length+' 張(已補牌)'); } });
  for(let i=0;i<4;i++){ if(checkHuaHu(i)) return; } // 起手即集滿 8 花 → 直接花胡
  refreshAll();
  renderMyHand(); // 發牌完成立即顯示自己的手牌(不用等輪到自己)
  await sleep(AUTOPLAY?150:500);
  log('發牌完成 · 莊家 '+seatWind(dealer)+' 先摸牌');
  G._dealerInitialTenpai = !!findWinningTile(G.players[dealer].hand, meldCount(G.players[dealer])); // 天聽:莊家起手即聽
  draw(turn);
}
function findWinningTile(hand16, openMelds){
  // 掃所有牌型, 找一張補進 hand16 就能胡的牌(demo 尾盤用)
  const cands=[];
  for(const s of SUITS) for(let n=1;n<=9;n++) cands.push({s,n});
  for(let n=1;n<=4;n++) cands.push({s:'feng',n});
  for(let n=1;n<=3;n++) cands.push({s:'jian',n});
  for(const c of cands){ const t={...c,id:Math.random()}; if(isWin([...hand16,t], openMelds)) return t; }
  return null;
}
function meldCount(p){ return p.melds? p.melds.length : 0; }
/* ===== 聽牌指示燈 (2026-10-08) ===== */
const TING_KINDS=[['wan',9],['tong',9],['tiao',9],['feng',4],['jian',3]];
function tingWaits(h, mc){
  const out=[];
  for(const [s,max] of TING_KINDS) for(let n=1;n<=max;n++){
    try{ if(isWin([...h,{s,n}], mc)) out.push({s,n}); }catch(e){}
  }
  return out;
}
function updateTing(s){
  const chip=document.getElementById('ting-chip'); if(!chip) return;
  const lbl=tl('聽');
  chip.classList.remove('on'); chip.textContent=lbl; chip.title='';
  let hand=null, mc=0;
  if(s&&s.myHand){ hand=s.myHand.slice(); const seat=s.seats&&s.seats[myOnlineSeat]?s.seats[myOnlineSeat]:null; mc=(seat&&seat.melds)?seat.melds.length:0; }
  else if(typeof G!=='undefined'&&G&&G.players&&G.players[2]){ hand=G.players[2].hand.slice(); mc=meldCount(G.players[2]); }
  else return;
  if(!hand||!hand.length) return;
  const expectWin=(5-mc)*3+2;
  let w=null;
  if(hand.length===expectWin-1){ w=tingWaits(hand,mc); }
  else if(hand.length===expectWin){
    for(let i=0;i<hand.length;i++){ const rest=hand.slice(0,i).concat(hand.slice(i+1)); const wk=tingWaits(rest,mc); if(wk.length){ w=wk; break; } }
  }
  if(w&&w.length){ const names=w.map(t=>tileName(t)); chip.textContent=lbl+' '+names.join(''); chip.title=lbl+' '+names.join('、'); chip.classList.add('on'); }
}
function checkHuaHu(seatIdx){
  // 摸齊 8 張花 → 直接花胡(八仙過海), 算 8 台
  const p=G.players[seatIdx];
  if(!p||!p.flowers||p.flowers.length<8) return false;
  G.phase='winning';
  const who=seatIdx===2?'你':(p.name||'AI');
  status('🌸 '+who+' 花胡(八仙過海)！');
  sfx('hu');
  log('🌸 '+who+' 花胡(八仙過海)！');
  setTimeout(()=>showHuReveal(seatIdx, true), 500);
  return true;
}
function selfDrawCheck(seatIdx, isKongDraw){
  const p=G.players[seatIdx];
  const m=meldCount(p);
  if(isWin(p.hand, m)){
    winKongDraw = !!isKongDraw;   // 槓後補牌自摸 = 槓上開花
    const tag = isKongDraw ? '槓上開花' : '自摸';
    // 鎖住流程但不要設 ended(endGame 開頭看到 ended 會直接 return, 結算就不會跳出)
    G.phase='winning';
    if(seatIdx===2){status('🎉 你'+tag+'了！');}
    else{status((p.name||'AI')+' '+tag+'！');}
    sfx('hu');
    setTimeout(()=>showHuReveal(seatIdx, true), 600);
    return true;
  }
  return false;
}
function draw(seatIdx){
  const p=G.players[seatIdx];
  if(G.wall.length===0){endGame(null,'流局');return;}
  // 摸牌 (花牌循環補到非花)
  let t=null;
  if(AUTOPLAY && G.wall.length<=40){ t=findWinningTile(p.hand, meldCount(p)); } // 尾盤送胡(提前讓示範能胡)
  let guard=0;
  while(guard++<10){
    if(!t){ if(!G.wall.length){endGame(null,'流局');return;} t=G.wall.pop(); }
    if(t.s==='hua'){ p.flowers.push(t); sfx('flower'); log(seatWind(seatIdx)+'家 摸到花牌 '+tileName(t)+' → 補牌'); if(checkHuaHu(seatIdx)) return; t=null; continue; }
    break;
  }
  p.hand.push(t);
  G.drawTile=t;
  G._curFirstDraw=!!G._seatFirstDraw[seatIdx]; G._seatFirstDraw[seatIdx]=false;
  sfx('draw');
  renderWall();
  if(seatIdx===2){renderMyHand();}
  if(selfDrawCheck(seatIdx,false)) return;
  G.phase='play';
  afterDraw(seatIdx);
}
function afterDraw(seatIdx){
  const p=G.players[seatIdx];
  G.phase='play';
  highlightActive(); // 2026-10-08 John: 輪到該家 → 先亮他的河牌區, 再等出牌(修正: 輪到自己時卻還亮在上家)
  if(seatIdx===2){
    G.phase='my_turn';
    status(AUTOPLAY?'(自動示範) 輪到你出牌…':'輪到你 — 點一張牌,再按「出牌」');
    if(!AUTOPLAY){ const bd=document.getElementById('btn-discard'); if(bd){bd.disabled=false;bd.classList.add('actionable');} }
    renderMyHand();
    if(AUTOPLAY){
      // AI/自動: 可暗槓/可補槓先槓
      const ag=findAnGangTile(2);
      if(ag){ setTimeout(()=>doAnGang(2,ag),300); return; }
      const bg=findBuGangTile(2);
      if(bg){ setTimeout(()=>doBuGang(2,bg.tile,bg.meld),300); return; }
      setTimeout(()=>aiDiscard(2),400);
    }else{
      // 手動: 可暗槓或可補槓就亮按鈕
      const ag=findAnGangTile(2), bg=findBuGangTile(2);
      if(ag||bg){ const b=document.getElementById('btn-gang'); if(b){b.disabled=false;b.textContent=ag?'暗槓':'補槓';b.classList.add('actionable');} }
      // 出牌限時 15 秒, 歸零自動托管出牌
      startTurnClock(15, autoDiscardByTimeout);
    }
  }else{
    status(seatWind(seatIdx)+'家 摸牌思考…');
    setTimeout(()=>{
      const ag=findAnGangTile(seatIdx), bg=findBuGangTile(seatIdx);
      if(ag&&Math.random()<0.5){ doAnGang(seatIdx,ag); }
      else if(bg&&Math.random()<0.45){ doBuGang(seatIdx,bg.tile,bg.meld); }
      else aiDiscard(seatIdx);
    }, AUTOPLAY?320:1300);
  }
}
function findBuGangTile(seatIdx){
  const p=G.players[seatIdx];
  if(!p) return null;
  for(const m of p.melds){
    if(m.type!=='peng'||!m.tiles||!m.tiles.length) continue;
    const t0=m.tiles[0];
    const hit=p.hand.find(x=>x.s===t0.s&&x.n===t0.n);
    if(hit) return {tile:hit, meld:m};
  }
  return null;
}
function doBuGang(seatIdx, tile, meld){
  turn=seatIdx;
  const p=G.players[seatIdx];
  // 手牌移除那張
  let left=1;
  p.hand=p.hand.filter(x=>{ if(left>0&&x.s===tile.s&&x.n===tile.n){left--;return false;} return true; });
  // 碰組升級為槓(4張)
  meld.type='gang';
  meld.tiles.push({...tile});
  log((seatIdx===2?'你':p.name)+' 補槓 '+tileName(tile)+' (碰牌加槓)');
  sfx('gang');
  kongReplace(seatIdx);
}
function findAnGangTile(seatIdx){
  const p=G.players[seatIdx];
  if(!p) return null;
  for(const t of p.hand){
    if(p.hand.filter(x=>x.s===t.s&&x.n===t.n).length===4) return t;
  }
  return null;
}
function aiDiscard(seatIdx){
  const p=G.players[seatIdx];
  const t=aiChooseDiscard(p);
  discard(seatIdx,t);
}
function discard(seatIdx,t){
  turn=seatIdx;
  const p=G.players[seatIdx];
  p.hand=p.hand.filter(x=>x!==t);
  p.river.push(t);
  G.lastDiscard=t;G.lastDiscarder=seatIdx;
  G.drawTile=null;
  sfx('discard');
  log(seatWind(seatIdx)+'家 打出 '+tileName(t));
  if(seatIdx===2)renderMyHand();
  refreshAll();
  // 情境台追蹤: 地聽(第一次出牌後即聽牌、且無吃碰) / 出牌計數(天胡/地胡/人胡)
  if(G._seatDiscards[seatIdx]===0 && (!p.melds || p.melds.length===0) && findWinningTile(p.hand, meldCount(p))) G._seatFirstDrawTenpai[seatIdx]=true;
  G._seatDiscards[seatIdx]++; G._discardsMade++;
  beginAsk(seatIdx);
}
// ============ 出牌後詢問 吃/碰/槓/胡 ============
function canHuDiscard(seatIdx, tile){
  const p=G.players[seatIdx];
  if(!p||p.hand.length===0) return false;
  const test=p.hand.concat([{...tile,id:'ask'}]);
  return isWin(test, meldCount(p));
}
function canPengDiscard(seatIdx, tile){
  const p=G.players[seatIdx];
  return p.hand.filter(x=>x.s===tile.s&&x.n===tile.n).length>=2;
}
function canGangDiscard(seatIdx, tile){
  const p=G.players[seatIdx];
  return p.hand.filter(x=>x.s===tile.s&&x.n===tile.n).length>=3;
}
function chiOptions(seatIdx, tile){
  // 回傳所有可行的吃法組合(每組為要拿出來配對的兩張數牌號)
  if(!tile||(tile.s!=='wan'&&tile.s!=='tong'&&tile.s!=='tiao')) return [];
  if(((seatIdx+3)%4)!==G.lastDiscarder) return []; // 只能吃上家出的牌
  const p=G.players[seatIdx];
  const n=tile.n;
  const has=x=>p.hand.some(y=>y.s===tile.s&&y.n===x);
  const opts=[];
  if(has(n-1)&&has(n-2)) opts.push([n-2,n-1]);
  if(has(n-1)&&has(n+1)) opts.push([n-1,n+1]);
  if(has(n+1)&&has(n+2)) opts.push([n+1,n+2]);
  return opts;
}
function canChiDiscard(seatIdx, tile){
  return chiOptions(seatIdx, tile).length>0;
}
function beginAsk(fromSeat){
  if(G.phase==='ended')return;
  const tile=G.lastDiscard;
  // 決定詢問順序: 下家→對家→上家 (fromSeat+1,+2,+3)
  const order=[(fromSeat+1)%4,(fromSeat+2)%4,(fromSeat+3)%4];
  G.askQueue=[];G.askTile=tile;G.askFrom=fromSeat;
  for(const si of order){
    const opt={seat:si,hu:canHuDiscard(si,tile),peng:canPengDiscard(si,tile),gang:canGangDiscard(si,tile),chi:canChiDiscard(si,tile)};
    if(opt.hu||opt.peng||opt.gang||opt.chi) G.askQueue.push(opt);
  }
  processAsk();
}
function processAsk(){
  if(G.phase==='ended')return;
  // 找第一個可動作玩家; 玩家(seat2)優先
  let target=null;
  for(const o of G.askQueue){ if(o.seat===2){target=o;break;} }
  if(!target&&G.askQueue.length){ target=G.askQueue[0]; }
  if(!target){ afterAskAllPass(); return; }
  G.askQueue=G.askQueue.filter(o=>o!==target);
  const who=target.seat===2?'你':(G.players[target.seat].name||('AI-'+target.seat));
  if(target.seat===2&&!AUTOPLAY){
    // 玩家手動選擇
    G.phase='ask';
    askTargetForTimeout=target;
    showActionButtons(target);
    const acts=[];
    if(target.hu)acts.push('胡'); if(target.gang)acts.push('槓'); if(target.peng)acts.push('碰'); if(target.chi)acts.push('吃');
    status('🖐 '+who+' 可以 '+acts.join('/')+' '+tileName(G.askTile)+' — 請按按鈕或「過」');
    // 吃碰槓決策限時 15 秒, 歸零自動托管(可胡自動胡, 否則過)
    startTurnClock(15, autoPassByTimeout);
  }else{
    // AI / demo 自動決策
    const act=aiDecideAction(target);
    if(act==='hu'){ doHu(target.seat,false); }
    else if(act==='gang'){ doGang(target.seat, G.askTile); }
    else if(act==='peng'){ doPeng(target.seat, G.askTile); }
    else if(act==='chi'){ doChi(target.seat, G.askTile); }
    else { setTimeout(processAsk, AUTOPLAY?150:400); }
  }
}
function aiDecideAction(opt){
  const r=Math.random();
  if(opt.hu) return 'hu';
  if(opt.gang&&r<0.5) return 'gang';
  if(opt.peng&&r<0.6) return 'peng';
  if(opt.chi&&r<0.4) return 'chi';
  return null;
}
function showActionButtons(opt){
  setBtn('btn-chi',opt.chi); setBtn('btn-peng',opt.peng); setBtn('btn-gang',opt.gang); setBtn('btn-hu',opt.hu);
  document.getElementById('btn-pass').disabled=false;
}
function setBtn(id,on){
  const b=document.getElementById(id); if(!b)return; b.disabled=!on;
  if(on){b.classList.add('actionable');}else{b.classList.remove('actionable');}
}
function afterAskAllPass(){
  setBtn('btn-chi',false);setBtn('btn-peng',false);setBtn('btn-gang',false);setBtn('btn-hu',false);
  document.getElementById('btn-pass').disabled=true;
  if(G.phase==='ended')return;
  nextTurn();
}
function nextTurn(){
  if(G.phase==='ended')return;
  // 2026-10-08 John: 出牌後停頓一下, 讓「剛打出的牌/該家河牌區」先看清楚, 再換下一家亮
  setTimeout(()=>{ if(G.phase==='ended')return; turn=(G.lastDiscarder+1)%4; draw(turn); }, AUTOPLAY?250:700); // 出牌者的下家摸牌
}
function takeFromRiver(tile){
  // 吃/碰/明槓拿走別人打出的牌 → 從出牌者河(river)移除, 牌移動到吃碰者面前
  const d=G.players[G.lastDiscarder];
  if(!d||!d.river) return;
  for(let i=d.river.length-1;i>=0;i--){
    if(d.river[i].s===tile.s&&d.river[i].n===tile.n){ d.river.splice(i,1); break; }
  }
}
function doPeng(seatIdx, tile){
  turn=seatIdx; // 高亮同步: 現在是該家在動作
  const p=G.players[seatIdx];
  let left=2;
  p.hand=p.hand.filter(x=>{ if(left>0&&x.s===tile.s&&x.n===tile.n){left--;return false;} return true; });
  takeFromRiver(tile); // 碰走的牌移出出牌者河
  p.melds.push({type:'peng', tiles:[tile,{...tile},{...tile}]});
  sfx('peng');
  log((seatIdx===2?'你':p.name)+' 碰 '+tileName(tile));
  afterMeldAction(seatIdx);
}
function doChi(seatIdx, tile, take){
  turn=seatIdx;
  const p=G.players[seatIdx];
  const n=tile.n;
  const has=x=>p.hand.findIndex(y=>y.s===tile.s&&y.n===x);
  if(!take||!take.length){
    take=[];
    if(has(n-2)>=0&&has(n-1)>=0) take=[n-2,n-1];
    else if(has(n-1)>=0&&has(n+1)>=0) take=[n-1,n+1];
    else if(has(n+1)>=0&&has(n+2)>=0) take=[n+1,n+2];
  }
  const sorted=[...take,n].sort((a,b)=>a-b);
  takeFromRiver(tile); // 吃走的牌移出出牌者河
  p.melds.push({type:'chi', tiles:sorted.map(x=>({s:tile.s,n:x}))});
  p.hand=p.hand.filter(y=>{ const i=take.indexOf(y.n); if(i>=0&&y.s===tile.s){take.splice(i,1);return false;} return true; });
  sfx('chi');
  log((seatIdx===2?'你':p.name)+' 吃 '+tileName(tile)+' → '+sorted.join(','));
  afterMeldAction(seatIdx);
}
function doGang(seatIdx, tile){
  turn=seatIdx;
  const p=G.players[seatIdx];
  let left=3;
  p.hand=p.hand.filter(x=>{ if(left>0&&x.s===tile.s&&x.n===tile.n){left--;return false;} return true; });
  takeFromRiver(tile); // 明槓拿走的牌移出出牌者河
  p.melds.push({type:'gang', tiles:[tile,tile,tile,tile]});
  sfx('gang');
  log((seatIdx===2?'你':p.name)+' 槓 '+tileName(tile));
  kongReplace(seatIdx);
}
function doAnGang(seatIdx, t){
  turn=seatIdx;
  const p=G.players[seatIdx];
  let left=4;
  p.hand=p.hand.filter(x=>{ if(left>0&&x.s===t.s&&x.n===t.n){left--;return false;} return true; });
  p.melds.push({type:'angang', tiles:[t,t,t,t]});
  sfx('gang');
  log((seatIdx===2?'你':p.name)+' 暗槓 '+tileName(t));
  kongReplace(seatIdx);
}
function kongReplace(seatIdx){
  const p=G.players[seatIdx];
  if(!G.wall.length){endGame(null,'流局');return;}
  let guard=0;
  while(guard++<10){
    if(!G.wall.length){endGame(null,'流局');return;}
    const t=G.wall.pop();
    if(t.s==='hua'){ p.flowers.push(t); log(seatWind(seatIdx)+'家 槓後補到花 '+tileName(t)+' → 再補'); if(checkHuaHu(seatIdx)) return; continue; }
    p.hand.push(t); G.drawTile=t; renderWall();
    if(seatIdx===2)renderMyHand();
    break;
  }
  if(selfDrawCheck(seatIdx,true)) return;
  afterMeldAction(seatIdx, true); // 槓後有補牌 → 允許連續槓再檢查
}
function afterMeldAction(seatIdx, allowGang){
  refreshAll();
  // 連續槓: 只有槓後(allowGang=true, 有補牌)才能再檢查暗槓/補槓; 吃/碰後依規則必須直接出牌
  const ag=allowGang?findAnGangTile(seatIdx):null;
  const bg=allowGang?findBuGangTile(seatIdx):null;
  if(seatIdx===2){
    renderMyHand(); G.phase='my_turn';
    // 吃碰槓完成後輪到自己出牌 → 亮出牌鈕(John 2026-09-08)
    if(!AUTOPLAY){ const bd=document.getElementById('btn-discard'); if(bd){bd.disabled=false;bd.classList.add('actionable');} }
    if(AUTOPLAY){
      if(ag){ setTimeout(()=>doAnGang(2,ag),300); return; }
      if(bg){ setTimeout(()=>doBuGang(2,bg.tile,bg.meld),300); return; }
      setTimeout(()=>aiDiscard(2),400); return;
    }
    if(ag||bg){
      // 可再槓: 亮槓鈕讓玩家選擇(也可直接點牌出牌)
      const b=document.getElementById('btn-gang');
      if(b){ b.disabled=false; b.textContent=ag?'暗槓':'補槓'; b.classList.add('actionable'); }
      status((ag&&bg?'可暗槓 / 可補槓':(ag?'可暗槓':'可補槓'))+' — 可再槓,或點牌直接出牌');
      startTurnClock(15, autoDiscardByTimeout);
      return;
    }
    status('已完成吃碰槓 — 請點牌出牌');
    startTurnClock(15, autoDiscardByTimeout);
  }else{
    G.phase='play';
    setTimeout(()=>{
      const ag2=findAnGangTile(seatIdx), bg2=findBuGangTile(seatIdx);
      if(ag2&&Math.random()<0.5){ doAnGang(seatIdx,ag2); }
      else if(bg2&&Math.random()<0.45){ doBuGang(seatIdx,bg2.tile,bg2.meld); }
      else aiDiscard(seatIdx);
    }, AUTOPLAY?320:1200);
  }
}
function showHuReveal(winnerIdx, selfDraw){
  // 胡牌攤牌: 內容直接填進結果視窗的攤牌區, 與結算單同畫面固定顯示
  const p=G.players[winnerIdx];
  if(!p) return;
  const huaHu=(p.flowers||[]).length>=8; // 花胡: 無胡牌張, 用最後一朵花代表
  const winTile = huaHu ? null : (selfDraw ? G.drawTile : G.lastDiscard); // 胡牌張
  // 胡牌張放大(花胡時改放一朵花)
  const wt=document.getElementById('hu-win-tile'); wt.innerHTML='';

  else if(winTile){ const d=tileEl(winTile,{extra:''}); wt.appendChild(d); }
  const hint=document.getElementById('hu-hint');
  hint.textContent = huaHu ? '🌸 八花齊聚 花胡！' : (winTile ? ('胡  '+tileName(winTile)) : ('共 '+ (p.melds?p.melds.length:0) +' 面子'));
  const hp=document.getElementById('hu-hand'); if(hp){
    hp.innerHTML='';

    const all=[];
    (p.melds||[]).forEach(m=>m.tiles.forEach(t=>all.push(t)));
    all.push(...p.hand);
    all.sort((a,b)=>a.s===b.s?a.n-b.n:a.s.localeCompare(b.s));

  endGame(winnerIdx, selfDraw);
}
function doHu(seatIdx, selfDraw){
  stopTurnClock();
  if(!selfDraw){ winKongDraw=false; }  // 放炮胡非槓上開花
  // 放炮胡: 胡牌張(別家打出的那張)一定要補進自己手牌 → 攤牌/台數結構檢查才有完整 17張
  if(!selfDraw && G.lastDiscard && G.players[seatIdx]){
    const p=G.players[seatIdx];
    // 算出補進去後該張的總數: 該張最多 4 張, 若手中已有 3 張以上就代表早就包含(防呆), 否則補上
    const cnt=p.hand.filter(x=>x.s===G.lastDiscard.s&&x.n===G.lastDiscard.n).length;
    if(cnt<3){
      p.hand.push({s:G.lastDiscard.s, n:G.lastDiscard.n, id:'win'+Math.random()});
    }
  }
  G.phase='winning';
  status(selfDraw?'🎉 你自摸 胡牌！':((seatIdx===2?'你':G.players[seatIdx].name)+' 胡牌！'));

}

  const left=p.hand.slice().sort((a,b)=>a.s===b.s?a.n-b.n:a.s.localeCompare(b.s))[0];

function endGame(winnerIdx,selfDraw){
  stopTurnClock();
  if(G&&G.phase==='ended')return;
  if(G)G.phase='ended';
  hideActionButtons(); // 胡牌後下方六顆按鈕全部重設
  const stake=curStake();
  const mask=document.getElementById('result-mask');
  const title=document.getElementById('res-title');
  const win=document.getElementById('res-winner');
  const table=document.getElementById('res-table');
  const sub=document.getElementById('res-sub');
  const reveal=document.getElementById('res-reveal');
  if(reveal) reveal.classList.toggle('hidden', winnerIdx===null); // 流局不顯示攤牌區
  if(winnerIdx===null){
    lastHuSeat=-1;
    title.textContent='流局';
    title.style.fontSize='34px';
    title.style.marginBottom='10px';
    if(win){win.style.display='none';}
    if(sub){sub.style.display='none';}
    if(table){table.style.display='none';}
  }else{
    // 還原(流局隱藏過的元素)
    title.style.fontSize='';
    title.style.marginBottom='';
    if(win){win.style.display='';}
    if(sub){sub.style.display='';}
    if(table){table.style.display='';}
    const p=G.players[winnerIdx];
    const huaHu=(p.flowers||[]).length>=8; // 花胡(八仙過海)
    const meldTiles=(p.melds||[]).flatMap(m=>m.tiles);
    const winTileX=huaHu?null:(selfDraw?G.drawTile:G.lastDiscard);
    const ct=calcTai(p.hand,selfDraw,winnerIdx===dealer, winnerIdx, circlesDone, dealerStreak, p.melds||[], p.flowers, meldTiles, winTileX, !selfDraw && G.lastDiscarder===dealer, {gangShang: selfDraw && winKongDraw, haiDi: !!selfDraw && G.wall.length===0, heDi: !selfDraw && G.wall.length===0, tianHu: !!selfDraw && winnerIdx===dealer && G._discardsMade===0, diHu: !!selfDraw && winnerIdx!==dealer && !!G._curFirstDraw && G._discardsMade<=1, renHu: !selfDraw && winnerIdx!==dealer && G._discardsMade===1 && G.lastDiscarder===dealer, tianTing: winnerIdx===dealer && !!G._dealerInitialTenpai, diTing: winnerIdx!==dealer && !!G._seatFirstDrawTenpai[winnerIdx]});
    // 注意: winVerb 必須在 ct 之後(ct.tai 判斷屁胡 0 台)
    const winVerb=huaHu?'花胡':(ct.tai===0?'屁胡':(selfDraw?'自摸':'胡牌'));
    lastHuSeat=winnerIdx;
    const who=winnerIdx===2?'你':p.name;
    const payers = selfDraw? [0,1,2,3].filter(i=>i!==winnerIdx) : [G.lastDiscarder];
    const BASE=stake.b, PER_TAI=stake.t;
    const perPayer=BASE + ct.tai*PER_TAI;   // 底 + 台數×每台
    // John 2026-09-08: 閒家自摸 → 莊家那份多付「莊家台1 + 連莊台照算」; 連莊多次多付多次(對稱莊家放炮)
    const dealerExtraTai = (selfDraw && winnerIdx!==dealer) ? (1 + (dealerStreak>1 ? (dealerStreak-1)*2 : 0)) : 0;
    const dealerExtra = dealerExtraTai * PER_TAI;
    const payOf = i => perPayer + (dealerExtraTai && i===dealer ? dealerExtra : 0);
    const total = payers.reduce((s,i)=>s+payOf(i),0);
    const fee=Math.round(total*5)/100;
    const net=total-fee;
    const iAmWinner = winnerIdx===2;
    const iPay = payers.includes(2); // 你是否要付錢
    const lastP=G.players[G.lastDiscarder];
    // 本場統計(自己 = seat 2):台數=胡的台數、底數=胡到的家數(自摸3家/放炮胡1家);輸的局扣回去 → 可為負
    myStats.plays++;
    if(winnerIdx===2){
      myStats.wins++;
      myStats.tai += ct.tai;
      myStats.base += (selfDraw?3:1);
    }else if(payers.includes(2)){
      myStats.tai -= ct.tai;
      myStats.base -= 1;
    }
    // —— 台數明細共用 ——
    function taiRows(){
      let r='';
      ct.breakdown.forEach(b=>{ r+='<tr><td>'+b.name+'</td><td class="num">+'+b.tai+'<span class="unit">台</span></td></tr>';});
      r+='<tr class="total-row"><td>合計台數</td><td class="num gold"><b>'+ct.tai+'<span class="unit">台</span></b></td></tr>';
      return r;
    }
    if(iAmWinner){
      // 你胡牌 → 完整結算(+實收)
      title.textContent=huaHu?'🌸 你花胡！':(ct.tai===0?'🎉 你屁胡！':(selfDraw?'🎉 你自摸 胡牌！':'🎉 你胡牌！'));
      win.textContent=ct.tai+'台';
      let rows=taiRows();
      if(dealerExtraTai) rows+='<tr><td>莊家多付 '+dealerExtraTai+' 台(閒家自摸)</td><td class="num red">+'+dealerExtraTai+'<span class="unit">台</span></td></tr>';
      rows+='<tr><td>'+(selfDraw?'自摸 · 三家各付':'放炮者付')+'</td><td class="num">'+(selfDraw?'3':'1')+'<span class="unit">'+(MJ_LANG==='en'?(selfDraw?' players':' player'):MJ_LANG==='ja'?'人':MJ_LANG==='ko'?'명':' 家')+'</span></td></tr>';
      table.innerHTML=rows;
      sub.textContent='你'+winVerb+' '+ct.tai+'台';
      status('🎉 你'+winVerb+' '+ct.tai+'台');
      log('🏁 你'+winVerb+' '+ct.tai+'台');
    }else if(iPay){
      // 你付錢(放炮/自摸被收) → 只顯示你要付多少
      const byName = huaHu ? (who+' 花胡') : (selfDraw ? (who+' 自摸') : (who+' 胡牌'));
      title.textContent=huaHu?('💸 '+who+' 花胡！'):(selfDraw?('💸 '+who+' 自摸 胡牌！'):'💸 你放炮！');
      win.textContent=ct.tai+'台';
      let rows='<tr><td class="muted">'+byName+' '+ct.tai+'台</td></tr>';
      rows+=taiRows();
      if(dealerExtraTai && dealer===2) rows+='<tr><td>你是莊家 · 閒家自摸多付 '+dealerExtraTai+' 台</td><td class="num red">+'+dealerExtraTai+'<span class="unit">台</span></td></tr>';
      rows+='<tr class="total-row red"><td>'+(selfDraw?'你應付':'你放炮應付')+'</td><td class="num"><b>'+ct.tai+'<span class="unit">台</span></b></td></tr>';
      table.innerHTML=rows;
      sub.textContent=selfDraw?('你付 '+ct.tai+' 台'+(dealerExtraTai&&dealer===2?' (莊家多付 '+dealerExtraTai+' 台)':'')):('你放炮 · 付 '+ct.tai+' 台');
      status('💸 '+(selfDraw?'你付 ':'你放炮付 ')+ct.tai+' 台');
      log('💸 '+(selfDraw?'你付 ':'你放炮付 ')+ct.tai+' 台');
    }else{
      // 旁觀: 別家胡牌與你無關(只顯示結果, 不帶/實收細項)
      const payerName = huaHu? '花胡(三家各付)' : (selfDraw? '三家各付' : ((lastP?lastP.name:'放炮者')+' 付'));
      title.textContent=huaHu?('🌸 '+who+' 花胡！'):(selfDraw?('🎉 '+who+' 自摸 胡牌！'):('🎉 '+who+' 胡牌！'));
      win.textContent=ct.tai+'台';
      let rows='<tr><td class="muted">'+who+' '+winVerb+' '+ct.tai+'台</td></tr>';
      rows+=taiRows();
      table.innerHTML=rows;
      sub.textContent=who+' '+winVerb+' '+ct.tai+'台';
      status('🎉 '+who+' '+winVerb+' '+ct.tai+'台');
      log('🏁 '+who+' '+winVerb+' '+ct.tai+'台');
    }
  }
  mask.classList.remove('hidden');
  startNextRoundTimer();
}

  const t=document.getElementById('mode-title'); if(t) t.textContent=tl('選擇局數');
  const opts=[
    ['free', tl('隨意'), tl('不限局數,按「退出」結束')],
    ['circle', tl('一圈'), tl('打完一圈(四家各作莊一次)')],
    ['jiang', tl('一將'), tl('打完四圈(至少 16 局)')]
  ];
  box.innerHTML='';
  opts.forEach(function(o){
    const b=document.createElement('button');
    b.className='btn'; b.style.cssText='display:block;width:100%;text-align:left;padding:14px 16px';
    b.innerHTML='<b style="font-size:18px;color:#04120c">'+o[1]+'</b><div style="margin-top:5px;font-size:13.5px;font-weight:500;color:#04120c;opacity:.92;line-height:1.45">'+o[2]+'</div>';
    b.onclick=function(){ beginSession(o[0]); };
    box.appendChild(b);
  });
  document.getElementById('mode-mask').classList.remove('hidden');
  const bb=document.getElementById('bottom-bar'); if(bb) bb.style.display='none'; // #1: 退出被遮罩蓋住沒作用
}
function beginSession(mode){
  gameMode=(mode==='circle'||mode==='jiang')?mode:'free';
  dealer=1; dealerStart=1; dealerStreak=1; lastHuSeat=-1; winKongDraw=false;
  roundNo=1; handsAtRoundStart=1; circlesDone=0;
  myStats.wins=0; myStats.tai=0; myStats.base=0; myStats.plays=0;
  const m=document.getElementById('mode-mask'); if(m) m.classList.add('hidden');
  const bb=document.getElementById('bottom-bar'); if(bb) bb.style.display='';
  startGame();
}
function _sgn(v){ return (v>0?'+':(v<0?'−':''))+Math.abs(v); }
function endSession(){
  stopTurnClock(); stopNextRoundTimer();
  document.getElementById('result-mask').classList.add('hidden');
  const bb=document.getElementById('bottom-bar'); if(bb) bb.style.display='none'; // 同上:避免底部「退出」被遮罩蓋住
  const mt=document.getElementById('sum-mode');
  if(mt){ mt.textContent=(gameMode==='jiang')?tl('一將'):tl('一圈'); }
  const box=document.getElementById('sum-body');
  if(box){
    box.innerHTML='<div>'+tf('共 {n} 局',{n:myStats.plays})+'</div>'+
      '<div>'+tf('你胡 {w} 局',{w:myStats.wins})+'</div>'+
      '<div style="font-size:20px;font-weight:900;color:var(--primary)">'+tf('累計台數 {t} 台',{t:_sgn(myStats.tai)})+'</div>'+
      '<div style="font-size:20px;font-weight:900;color:var(--primary)">'+tf('累計底數 {b} 家',{b:_sgn(myStats.base)})+'</div>';
  }
  document.getElementById('summary-mask').classList.remove('hidden');
}

/* ================= 大廳 ================= */
const STAKES=[
  {t:1,  b:5,   label:'台1'},
  {t:2,  b:10,  label:'台2'},
  {t:4,  b:20,  label:'台4'},
  {t:10, b:50,  label:'台10'},
  {t:20, b:100, label:'台20'},
];
let selStake=2;           // 0-4 固定, 5 = 自訂
let customs=[];           // 已送出的自訂桌型 [{t,b}]
let selCustom=-1;         // 目前選中的自訂 index
function csLabel(c){ return `台${c.t}/底${c.b}`; }
function renderCustomSaved(){
  const list=document.getElementById('cs-list');
  const cnt=document.getElementById('cs-count');
  cnt.textContent=customs.length;
  if(!customs.length){ list.innerHTML='<span class="muted small">送出後會出現在這裡，可點選使用</span>'; return; }
  list.innerHTML='';
  customs.forEach((c,i)=>{
    const chip=document.createElement('span');
    chip.className='cs-chip'+(i===selCustom?' sel':'');
    chip.innerHTML=`${csLabel(c)}<span class="x" title="刪除">✕</span>`;
    chip.onclick=(ev)=>{
      if(ev.target.classList.contains('x')){ customs.splice(i,1); if(selCustom===i)selCustom=-1; else if(selCustom>i)selCustom--; renderCustomSaved(); updateBuyin(); return; }
      selCustom=i;
      document.getElementById('c-tai').value=c.t;
      document.getElementById('c-base').value=c.b;
      renderCustomSaved(); updateBuyin();
    };
    list.appendChild(chip);
  });
}
function submitCustom(){
  const t=parseInt(document.getElementById('c-tai').value)||0;
  const b=parseInt(document.getElementById('c-base').value)||0;
  if(!(t>=1 && b>=1)){ alert('請輸入有效的每台金額與底注'); return; }
  const dup=customs.findIndex(c=>c.t===t&&c.b===b);
  if(dup>=0){ selCustom=dup; }
  else{ selCustom=customs.length; customs.push({t,b}); }
  renderCustomSaved(); updateBuyin();
}
function curStake(){      // 回傳 {t:每台, b:底注}
  if(selStake===5){
    if(selCustom>=0 && customs[selCustom]) return customs[selCustom];
    const t=Math.max(1,parseInt(document.getElementById('c-tai').value)||0);
    const b=Math.max(1,parseInt(document.getElementById('c-base').value)||0);
    return {t,b};
  }
  return STAKES[selStake];
}
function updateBuyin(){
  const cb=document.getElementById('custom-box');
  if(cb){ cb.classList.toggle('on', selStake===5); }
  if(selStake===5){
    const t=parseInt(document.getElementById('c-tai').value)||0;
    const b=parseInt(document.getElementById('c-base').value)||0;
    const ok = t>=1 && b>=1 && (b%1===0);
    document.getElementById('buyin-val').textContent=(ok? b*10 : '—');
    const cbuy=document.getElementById('c-buy'); if(cbuy)cbuy.textContent=(ok? b*10 : '—');
    document.getElementById('btn-start').disabled=!ok;
  }else{
    document.getElementById('buyin-val').textContent=curStake().b*10;
    document.getElementById('btn-start').disabled=false;
  }
}
function renderLobby(){
  const grid=document.getElementById('stake-grid');
  grid.innerHTML='';
  for(let i=0;i<6;i++){
    const d=document.createElement('div');
    d.className='stake'+(i===selStake?' sel':'');
    if(i<5){
      const s=STAKES[i];
      d.innerHTML=`<b>${s.label}</b><small>台數制</small>`;
    }else{
      d.innerHTML=`<b>自訂</b><small>自填台數</small>`;
    }
    d.onclick=()=>{selStake=i;renderLobby();updateBuyin();};
    grid.appendChild(d);
  }
  updateBuyin();
  const seats=document.getElementById('lobby-seats');
  seats.innerHTML='';
  ['🤖','🤖','🧑','🤖'].forEach((av,i)=>{
    const s=document.createElement('div');s.className='seat'+(i===2?' you':' filled');
    s.innerHTML=`<div class="av">${av}</div><div class="nm">${i===2?'你':'AI-'+(i<2?i+1:i)}</div>`;
    seats.appendChild(s);
  });
}

(function(){
  const mask=document.getElementById('result-mask');
  if(!mask) return;
  const cards=mask.querySelectorAll('.res-card');
  let drag=null;
  cards.forEach(card=>{
    card.style.cursor='grab';
    card.addEventListener('pointerdown',e=>{
      if(e.target.closest('button')) return;
      drag={el:card,x:e.clientX,y:e.clientY,tx:0,ty:0};
      const m=card.style.transform.match(/translate\((-?[\d.]+)px, *(-?[\d.]+)px\)/);
      if(m){drag.tx=parseFloat(m[1]);drag.ty=parseFloat(m[2]);}
      card.style.cursor='grabbing';
      e.preventDefault();
    });
  });
  window.addEventListener('pointermove',e=>{
    if(!drag) return;
    drag.el.style.transform='translate('+(drag.tx+e.clientX-drag.x)+'px, '+(drag.ty+e.clientY-drag.y)+'px)';
  });
  window.addEventListener('pointerup',()=>{ if(drag){ if(drag.el) drag.el.style.cursor='grab'; drag=null; } });
})();
