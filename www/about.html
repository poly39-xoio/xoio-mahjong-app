<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<title>關於 XOIO</title>
<link rel="icon" type="image/png" sizes="32x32" href="xoio-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="xoio.png">
<style>
:root{--card:#151b21;--line:#ffffff14;--pri:#2ad49e;--gold:#ffd166;--txt:#e8eaed;--sub:#9aa5b5}
*{box-sizing:border-box;margin:0;padding:0}
@font-face{font-family:'Huninn';src:url('fonts/Huninn.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url('fonts/Inter-latin.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('fonts/JetBrainsMono-latin.woff2') format('woff2');font-weight:400 800;font-style:normal;font-display:swap}
body{background:radial-gradient(circle at 50% -8%,#123a29 0%,#0b0e11 58%) fixed;color:var(--txt);font-family:'Campton','Avenir Next','Montserrat','Huninn',-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;padding:28px 20px 44px;min-height:100vh}
html[lang="ja"] body{font-family:'Campton','Avenir Next','Montserrat','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',-apple-system,sans-serif}
html[lang="ko"] body{font-family:'Campton','Avenir Next','Montserrat','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Nanum Gothic',-apple-system,sans-serif}
.wrap{max-width:430px;margin:0 auto;position:relative}
.lang{position:absolute;top:-6px;right:0;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.lang b{color:var(--pri)}
.langmenu{position:absolute;top:30px;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:2px;z-index:50;min-width:132px;box-shadow:0 12px 34px #0008}
.langmenu.on{display:flex}
.langmenu button{background:transparent;border:0;color:var(--txt);font-size:14px;font-weight:700;padding:9px 14px;border-radius:8px;text-align:left;cursor:pointer;font-family:inherit}
.langmenu button:hover{background:#ffffff12}
.langmenu button.cur{color:var(--pri)}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 16px;font-size:14px;font-weight:800;color:var(--pri);text-decoration:none}
.brand{font-size:30px;font-weight:900;letter-spacing:3px;color:var(--pri);text-align:center;margin-top:26px}
h1{font-size:21px;font-weight:900;margin:22px 0 8px;text-align:center;line-height:1.5}
.lead{color:var(--sub);font-size:14px;line-height:1.95;text-align:center}
section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}
section h2{font-size:14.5px;font-weight:800;color:var(--pri);letter-spacing:.6px;margin-bottom:10px}
section p,section li{font-size:13.5px;line-height:1.9;color:var(--sub)}
ul{padding-left:19px;margin-top:6px}
.foot{margin-top:26px;text-align:center;font-size:12px;color:var(--sub);line-height:2}

@media (min-width:760px){
  body{padding:40px 24px 58px}
  .wrap{max-width:820px}
  .brand{font-size:34px}
  h1{font-size:26px}
  .lead{font-size:15.5px}
  section p,section li{font-size:14.5px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="lang" id="langPill" onclick="toggleLangMenu(event)"><span id="langCur"></span></div>
  <div class="langmenu" id="langMenu">
    <button type="button" data-l="zh" onclick="pickLang('zh')">中文</button>
    <button type="button" data-l="en" onclick="pickLang('en')">English</button>
    <button type="button" data-l="ja" onclick="pickLang('ja')">日本語</button>
    <button type="button" data-l="ko" onclick="pickLang('ko')">한국어</button>
  </div>
  <a class="back" href="free.html" onclick="if(history.length>1){history.back();return false}" data-zh="← 返回" data-en="← Back" data-ja="← 戻る" data-ko="← 뒤로">← 返回</a>
  <div class="brand">XOIO</div>
  <h1 data-zh="把麻將,帶給每一個人" data-en="Mahjong for everyone" data-ja="麻雀を、すべての人へ" data-ko="마작을, 모두에게"></h1>
  <p class="lead" data-zh="我們是一間專注「麻將教學 × 娛樂」的獨立工作室。<br>讓老手打得過癮,讓新手第一次就上手。" data-en="An independent studio focused on <b>teaching</b> and <b>enjoying</b> mahjong.<br>Deep enough for veterans, friendly enough for your very first hand." data-ja="私たちは「麻雀の学び × 楽しさ」に特化したインディースタジオです。<br>ベテランは存分に、初心者は最初の一局から。" data-ko="우리는 '마작 배우기 × 즐기기'에 집중하는 인디 스튜디오입니다.<br>고수에겐 충분히, 초보에겐 첫 판부터 친근하게."></p>
  <section>
    <h2 data-zh="我們在做什麼" data-en="What we do" data-ja="私たちがしていること" data-ko="우리가 하는 일"></h2>
    <p data-zh="我們把台灣 16 張麻將做成人人可玩的 App:有 AI 陪你練、有台數教學帶你懂規則,還有一局接一局的實戰節奏。" data-en="We turn Taiwanese 16-tile Mahjong into an app anyone can pick up: an AI to practise with, scoring explained as you play, and a steady four-player rhythm." data-ja="台湾式16枚麻雀を、誰でも遊べるアプリにしました。AIと練習でき、遊びながら点数(台)を学べ、四人打ちのテンポで次々と対局できます。" data-ko="대만식 16장 마작을 누구나 즐길 수 있는 앱으로 만들었습니다. AI와 연습하고, 플레이하며 점수(타이)를 배우고, 4인 대국의 템포로 계속 이어집니다."></p>
    <ul>
      <li data-zh="<b>教學</b> —— 每一手列出牌型與台數,看懂「為什麼胡」;英文版同樣完整,讓非華人也能入門。" data-en="<b>Teaching</b> — every hand lists the tiles and scoring so you understand why you won. The English mode is complete, so no Chinese is required." data-ja="<b>学び</b> —— 毎手ごとに役と台数を表示し、「なぜ上がれたか」がわかります。英語モードも充実しているので、中国語がわからなくても始められます。" data-ko="<b>배움</b> —— 매번 역과 타이를 표시해 '왜 화료했는지'를 알 수 있습니다. 영어 모드도 완전해 중국어를 몰라도 시작할 수 있어요."></li>
      <li data-zh="<b>娛樂</b> —— 一個人也能開桌,隨時來一局,不必等牌咖。" data-en="<b>Fun</b> — one person can start a table anytime. No need to gather friends." data-ja="<b>楽しさ</b> —— 一人でも卓を囲めます。いつでも一局、相手を待たなくてOK。" data-ko="<b>재미</b> —— 혼자서도 테이블을 시작할 수 있습니다. 언제든 한 판, 기다릴 필요 없음."></li>
    </ul>
  </section>
  <section>
    <h2 data-zh="我們的堅持" data-en="Our promise" data-ja="私たちの約束" data-ko="우리의 약속"></h2>
    <ul>
      <li data-zh="<b>一次買斷</b> —— 永久暢玩,沒有內購、沒有廣告。" data-en="<b>One-time purchase</b> — yours forever. No in-app purchases, no ads." data-ja="<b>買い切り</b> —— ずっと遊べます。課金なし、広告なし。" data-ko="<b>한 번 구매</b> —— 영구 플레이. 인앱 결제 없음, 광고 없음."></li>
      <li data-zh="<b>乾淨體驗</b> —— 不打擾、不綁帳號、不蒐集不必要的資料。" data-en="<b>Clean by design</b> — no accounts, no intrusive tracking." data-ja="<b>クリーンな体験</b> —— アカウント不要、しつこい追跡なし。" data-ko="<b>깔끔한 경험</b> —— 계정 불필요, 불필요한 추적 없음."></li>
      <li data-zh="<b>持續更新</b> —— 更多牌型解說與玩法,陸續加入。" data-en="<b>Always improving</b> — more scoring guides and modes on the way." data-ja="<b>アップデート継続</b> —— 役の解説やモードを順次追加。" data-ko="<b>지속적 업데이트</b> —— 역 해설과 모드를 계속 추가합니다."></li>
    </ul>
  </section>
  <section>
    <h2 data-zh="聯絡我們" data-en="Contact" data-ja="お問い合わせ" data-ko="문의"></h2>
    <p data-zh="合作、媒體或任何問題,歡迎來信:<br><a style='color:var(--pri);text-decoration:none'>io@xoio.io</a>" data-en="Partnerships, press, or any question:<br><a style='color:var(--pri);text-decoration:none'>io@xoio.io</a>" data-ja="提携・取材・ご質問はこちらまで:<br><a style='color:var(--pri);text-decoration:none'>io@xoio.io</a>" data-ko="제휴·미디어·문의는 이메일로:<br><a style='color:var(--pri);text-decoration:none'>io@xoio.io</a>"></p>
  </section>
  <div class="foot">© XOIO · Mahjong for everyone</div>
</div>
<script>
var LANGS=['zh','en','ja','ko'];
var LNAMES={zh:'中文',en:'English',ja:'日本語',ko:'한국어'};
var TITLES={zh:'關於 XOIO',en:'About XOIO',ja:'XOIO について',ko:'XOIO 소개'};
function getLang(){
  try{ var v=localStorage.getItem('mj_lang'); if(v==='en'||v==='zh'||v==='ja'||v==='ko') return v; }catch(e){}
  try{ var ls=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||''];
    for(var i=0;i<ls.length;i++){ var t=(ls[i]||'').toLowerCase();
      if(t.indexOf('zh')===0) return 'zh';
      if(t.indexOf('ja')===0) return 'ja';
      if(t.indexOf('ko')===0) return 'ko';
    }
    if(ls.length&&ls[0]) return 'en';
  }catch(e){}
  return 'zh';
}
function applyLang(){
  var l=getLang(); document.documentElement.lang=(l==='zh'?'zh-Hant':l);
  var els=document.querySelectorAll('[data-zh]');
  for(var i=0;i<els.length;i++){
    var el=els[i]; var v=el.getAttribute('data-'+l);
    if(v===null) v=el.getAttribute('data-zh');
    if(v!==null) el.innerHTML=v;
  }
  var c=document.getElementById('langCur'); if(c) c.textContent=(LNAMES[l]||LNAMES.zh)+' ▾';
  var btns=document.querySelectorAll('#langMenu button');
  for(var j=0;j<btns.length;j++){ btns[j].className=(btns[j].getAttribute('data-l')===l)?'cur':''; }
  document.title=TITLES[l]||TITLES.zh;
}
function toggleLangMenu(e){ if(e&&e.stopPropagation) e.stopPropagation(); var m=document.getElementById('langMenu'); if(m) m.classList.toggle('on'); }
function pickLang(l){ try{ localStorage.setItem('mj_lang', l); }catch(e){} applyLang(); var m=document.getElementById('langMenu'); if(m) m.classList.remove('on'); }
document.addEventListener('click', function(){ var m=document.getElementById('langMenu'); if(m) m.classList.remove('on'); });
applyLang();
</script>
</body>
</html>
