<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<title>免費試玩 · 台灣麻將</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/free.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="麻將">
<link rel="apple-touch-icon" href="/pwa/mahjong-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-body:#0b0e11; --bg-card:#151b21; --border:#ffffff14;
    --primary:#2ad49e; --text-main:#e8eaed; --text-sub:#9aa5b5;
    --font-ui:'Inter',sans-serif; --font-num:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(circle at 50% -10%,#122631 0%,var(--bg-body) 55%) fixed;color:var(--text-main);font-family:var(--font-ui);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px}
  .wrap{width:100%;max-width:520px;text-align:center}
  .tile{width:76px;height:106px;background:#f4efe2;border:1px solid #c9bda0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;position:relative;margin:0 auto 22px}
  .tile::before{content:'';position:absolute;inset:5px;border:1px solid rgba(170,155,120,.4);border-radius:8px}
  .tile span{color:#0c5f2e;font-size:52px;font-weight:900;line-height:1;font-family:var(--font-ui)}
  h1{font-size:26px;font-weight:900;letter-spacing:.5px}
  .sub{color:var(--primary);font-size:13px;font-weight:800;letter-spacing:2px;font-family:var(--font-num);margin-top:10px}
  .desc{color:var(--text-sub);font-size:14px;line-height:1.9;margin-top:18px}
  .btn{display:inline-flex;align-items:center;gap:8px;margin-top:26px;background:var(--primary);color:#06231a;font-weight:900;font-size:15px;letter-spacing:.5px;border:0;border-radius:12px;padding:15px 34px;text-decoration:none;transition:.18s;box-shadow:0 10px 28px rgba(42,212,158,.3)}
  .btn:hover{transform:translateY(-2px)}
  .feats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
  .feat{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--text-sub)}
  .foot{margin-top:30px;font-size:11px;color:var(--text-sub);line-height:1.9}
  .foot a{color:var(--primary);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="tile"><span>發</span></div>
  <h1>免費試玩 台灣麻將</h1>
  <div class="sub">FREE PLAY · TAIWAN 16-TILE</div>
  <p class="desc">想學台灣 16 張麻將?先用 AI 練手感 —— <b>完全免費</b>。<br>無需註冊、沒有押注,純粹熟悉規則與出牌。</p>
  <a class="btn" href="/play.html">開始試玩 →</a>
  <div class="feats">
    <span class="feat">🤖 AI 陪玩</span>
    <span class="feat">🀄 台灣 16 張規則</span>
    <span class="feat">💸 完全免費</span>
  </div>
  <div class="foot">
    純教學練習 · 不涉及任何付費或押注<br>
    <a href="/about.html">關於 XOIO</a>
  </div>
</div>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/free-sw.js').catch(function(){});}</script>
</body>
</html>
