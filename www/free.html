<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<title>麻將16張</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="free.webmanifest">
<link rel="apple-touch-icon" href="pwa/mahjong-180.png">
<style>
:root{--bg:#0b0e11;--card:#151b21;--line:#ffffff14;--pri:#2ad49e;--gold:#ffd166;--txt:#e8eaed;--sub:#9aa5b5}
*{box-sizing:border-box;margin:0;padding:0}
@font-face{font-family:'Huninn';src:url('fonts/Huninn.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url('fonts/Inter-latin.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('fonts/JetBrainsMono-latin.woff2') format('woff2');font-weight:400 800;font-style:normal;font-display:swap}
body{background:radial-gradient(circle at 50% -8%,#123a29 0%,var(--bg) 58%) fixed;color:var(--txt);font-family:'Campton','Avenir Next','Montserrat','Huninn',-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;padding:28px 20px 40px;min-height:100vh}
html[lang="ja"] body{font-family:'Campton','Avenir Next','Montserrat','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',-apple-system,sans-serif}
html[lang="ko"] body{font-family:'Campton','Avenir Next','Montserrat','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Nanum Gothic',-apple-system,sans-serif}
button,input,select,textarea{font-family:inherit}
.wrap{max-width:430px;margin:0 auto;position:relative}
.lang{position:absolute;top:-6px;right:0;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.lang b{color:var(--pri)}
.langmenu{position:absolute;top:30px;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:2px;z-index:50;min-width:132px;box-shadow:0 12px 34px #0008}
.langmenu.on{display:flex}
.langmenu button{background:transparent;border:0;color:var(--txt);font-size:14px;font-weight:700;padding:9px 14px;border-radius:8px;text-align:left;cursor:pointer;font-family:inherit}
.langmenu button:hover{background:#ffffff12}
.langmenu button.cur{color:var(--pri)}
.icon{width:92px;height:92px;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:56px;font-family:'Huninn',sans-serif;font-weight:900;color:#0c5f2e;margin:26px auto 16px;box-shadow:0 10px 30px #0007}
h1{text-align:center;font-size:26px;font-weight:900;letter-spacing:1px}
.tag{text-align:center;color:var(--gold);font-size:15px;margin-top:10px;font-weight:800;line-height:1.6}
.sub{text-align:center;color:var(--sub);font-size:13px;margin-top:10px;line-height:1.8}
.cta{display:block;width:100%;margin-top:24px;background:linear-gradient(135deg,#2ad49e,#0e8f5f);color:#04231a;font-weight:900;font-size:17px;border:none;border-radius:15px;padding:17px;text-align:center;letter-spacing:1px;text-decoration:none;cursor:pointer}
.cta2{display:block;width:100%;margin-top:11px;background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:700;font-size:15px;border-radius:15px;padding:15px;text-align:center;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.card h2{font-size:14px;color:var(--pri);letter-spacing:.6px;margin-bottom:10px;font-weight:800}
.li{display:flex;gap:11px;font-size:13.5px;color:var(--sub);line-height:1.85;margin-top:8px}
.li b{color:var(--txt)}
.li .em{font-size:17px;line-height:1.4}
.contactbox{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.contactbox .ct-h{font-size:14px;font-weight:800;color:var(--pri);letter-spacing:.4px;margin-bottom:7px}
.contactbox .ct-p{font-size:13.5px;color:var(--sub);line-height:1.9}
.contactbox .ct-p .ct-mail{color:var(--pri);font-weight:800}
.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--sub)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:60}
.mask.on{display:block}
.modal{position:fixed;left:0;right:0;bottom:0;max-height:86vh;background:var(--card);border:1px solid var(--line);border-bottom:0;border-top-left-radius:22px;border-top-right-radius:22px;display:none;flex-direction:column;z-index:61;max-width:430px;margin:0 auto}
.modal.on{display:flex}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.mh b{font-size:16px;font-weight:900}
.mh .x{margin-left:auto;color:var(--sub);font-size:18px;cursor:pointer;padding:0 4px}
.mb{padding:16px 18px 28px;overflow:auto;-webkit-overflow-scrolling:touch}
.mb h3{font-size:13.5px;color:var(--pri);font-weight:800;margin:15px 0 6px}
.mb h3:first-child{margin-top:0}
.mb p,.mb li{font-size:13px;color:var(--sub);line-height:1.85}
.mb ul{padding-left:18px}
.tagchip{display:inline-block;background:#ffffff10;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12px;margin:3px 4px 0 0;color:var(--sub)}
.mj-tile{display:inline-block;width:1.25em;height:1.25em;vertical-align:-0.28em;border-radius:.24em;background:#fff;color:#0c5f2e;font-family:'Huninn',sans-serif;font-weight:900;text-align:center;line-height:1.25em;font-size:.82em;box-shadow:0 1px 2px rgba(0,0,0,.25);margin:0 .08em}
.mj-tile::before{content:"發"}

/* ===== 寬螢幕 / iPad 友善 2026-09-12 ===== */
@media (min-width:760px) and (min-height:601px){
  body{padding:40px 24px 58px}
  .wrap{max-width:940px}
  .icon{width:118px;height:118px;border-radius:28px;font-size:72px;margin-top:8px}
  h1{font-size:38px}
  .tag{font-size:19px;margin-top:12px}
  .sub{font-size:15px;margin-top:12px}
  .hero-actions{display:flex;gap:14px;max-width:660px;margin:28px auto 0}
  .cta{margin-top:0;flex:1;font-size:17px;padding:18px}
  .cta2{margin-top:0;flex:1;font-size:17px;padding:18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch;margin-top:18px}
  .grid>.card,.grid>.contactbox{margin-top:0}
  .grid>.contactbox{align-self:stretch}
  .card .li{font-size:14.5px}
  .foot{margin-top:30px}
}

/* ===== 手機橫向(短螢幕)緊湊版 2026-09-24 ===== */
@media (orientation:landscape) and (max-height:601px){
  body{padding:8px 16px 6px}
  .wrap{max-width:920px}
  .lang{top:-2px}
  .icon{width:44px;height:44px;border-radius:12px;font-size:26px;margin:0 auto 4px;box-shadow:0 4px 12px #0007}
  h1{font-size:18px}
  .tag{font-size:12px;margin-top:3px;line-height:1.35}
  .sub{font-size:11px;margin-top:3px;line-height:1.4}
  .hero-actions{display:flex;gap:10px;margin-top:8px;max-width:none}
  .cta,.cta2{flex:1;margin-top:0;font-size:15px;padding:12px;border-radius:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;margin-top:9px}
  .grid>.card,.grid>.aboutlink{margin-top:0}
  .card{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;padding:10px 13px;border-radius:13px}
  .card h2{grid-column:1/-1;margin-bottom:3px;font-size:12.5px}
  .li{margin-top:0;font-size:11.5px;line-height:1.45;gap:7px}
  .li .em{font-size:14px}
  .aboutlink{padding:11px 13px;border-radius:13px;font-size:13px}
  .foot{margin-top:6px;font-size:11px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="lang" id="langPill" onclick="toggleLangMenu(event)"><span id="langCur"></span></div>
  <div class="langmenu" id="langMenu">
    <button type="button" data-l="zh" onclick="pickLang('zh')">中文</button>
    <button type="button" data-l="en" onclick="pickLang('en')">English</button>
    <button type="button" data-l="ja" onclick="pickLang('ja')">日本語</button>
    <button type="button" data-l="ko" onclick="pickLang('ko')">한국어</button>
  </div>
  <div class="icon">發</div>
  <h1 data-zh="麻將16張" data-en="MahJong 16" data-ja="台湾麻雀 16張" data-ko="타이완 16장 마작">麻將16張</h1>
  <div class="tag" data-zh="下載到手機,把「發財」的運氣帶著走" data-en="Carry the luck of “Fa” (prosperity)" data-ja="「發」の運気をいつでも持ち歩こう" data-ko="‘發(파)’의 행운을 늘 함께"></div>
  <div class="hero-actions">
  <a class="cta" href="play.html" data-zh="開始遊戲" data-en="Start Playing" data-ja="ゲームを始める" data-ko="게임 시작">開始遊戲</a>
  <button class="cta2" onclick="openRules()" data-zh="📖 麻將教學 / 規則" data-en="📖 How to Play / Rules" data-ja="📖 遊び方 / ルール" data-ko="📖 게임 방법 / 규칙"></button>
  </div>
  <div class="grid">
  <div class="card">
    <h2 data-zh="為什麼玩「發」" data-en="Why play “Fa”" data-ja="「發」で遊ぶ理由" data-ko="‘發(파)’를 하는 이유"></h2>
    <div class="li"><span class="em"><span class='mj-tile'></span></span><span data-zh="<b>邊玩邊學</b><br>胡牌自動列出「台數」與牌型理由,清楚易懂。" data-en="<b>Learn as you play</b><br>On every win it lists the scoring tiles and why — clear and easy to follow." data-ja="<b>遊びながら学べる</b><br>アガリごとに「台(点数)」と役の理由を自動表示。わかりやすい。" data-ko="<b>하면서 배우기</b><br>화료할 때마다 ‘타이(점수)’와 역의 이유를 자동 표시. 알기 쉬워요."></span></div>
    <div class="li"><span class="em">🤖</span><span data-zh="<b>AI 對戰</b><br>一個人也能開桌,四家實戰節奏、隨時來一局。" data-en="<b>Play vs AI</b><br>Start a full four-player table anytime, no friends needed." data-ja="<b>AI対戦</b><br>一人でも卓を囲める。いつでもサッと一局。" data-ko="<b>AI 대전</b><br>혼자서도 테이블을 시작. 언제든 한 판."></span></div>
    <div class="li"><span class="em">📴</span><span data-zh="<b>單機可玩</b><br>無聊時、通勤、飛機上都能玩,無需連網。" data-en="<b>Playable offline</b><br>Bored, commuting, or on a flight — play with no internet." data-ja="<b>オフラインで遊べる</b><br>退屈なときも、通勤中も、機内でも。ネット接続不要。" data-ko="<b>오프라인 플레이</b><br>심심할 때, 출퇴근길, 비행기에서도. 인터넷 연결 없이."></span></div>
    <div class="li"><span class="em">🚫</span><span data-zh="<b>無廣告</b><br>一次買斷、無廣告、不打擾,給你最乾淨的 App。" data-en="<b>No ads</b><br>Buy once. No ads, no interruptions — the cleanest app for you." data-ja="<b>広告なし</b><br>買い切り、広告なし、邪魔なし。いちばんクリーンなアプリを。" data-ko="<b>광고 없음</b><br>한 번 구매, 광고 없음, 방해 없음 — 가장 깔끔한 앱."></span></div>
  </div>
  <div class="contactbox">
    <div class="ct-h" data-zh="聯絡我們" data-en="Contact" data-ja="お問い合わせ" data-ko="문의"></div>
    <div class="ct-p" data-zh="合作、媒體或任何問題,歡迎來信:<span class='ct-mail'>io@xoio.io</span>" data-en="Partnerships, press, or any question:<span class='ct-mail'>io@xoio.io</span>" data-ja="提携・取材・ご質問はこちらまで:<span class='ct-mail'>io@xoio.io</span>" data-ko="제휴·미디어·문의는 이메일로:<span class='ct-mail'>io@xoio.io</span>"></div>
  </div>
  </div>
  <div class="foot">© XOIO · Mahjong for everyone</div>
</div>

<div class="mask" id="rulesMask" onclick="closeRules()"></div>
<div class="modal" id="rulesModal">
  <div class="mh"><span>📖</span><b data-zh="台灣 16 張麻將 · 規則" data-en="Taiwanese Mahjong · Rules" data-ja="台湾式16枚麻雀 · ルール" data-ko="대만식 16장 마작 · 규칙"></b><span class="x" onclick="closeRules()">✕</span></div>
  <div class="mb">
    <h3 data-zh="怎麼玩" data-en="How to play" data-ja="遊び方" data-ko="게임 방법"></h3>
    <p data-zh="4 人同桌、每人 16 張牌。輪流摸牌、打牌,湊成 5 組面子 + 1 對將就能胡牌。" data-en="4 players, 16 tiles each. Draw and discard in turn; complete 5 sets + 1 pair to win." data-ja="4人で1台、手牌は各16枚。順にツモ・打牌を繰り返し、5面子+1雀頭を揃えれば上がり。" data-ko="4명이 한 테이블, 각자 16장. 돌아가며 뽑고 버리기. 5개 멜드+1개 머리를 만들면 화료."></p>
    <h3 data-zh="一、莊家 / 連莊拉莊" data-en="1. Dealer / dealer streak" data-ja="一、親 / 連荘" data-ko="1. 친 / 연장"></h3>
    <ul>
      <li data-zh="莊家台 1 台:莊家胡牌或自摸多算一台;莊家放槍也要多給胡家一台(由莊家支付)。" data-en="Dealer +1 tai: the dealer scores one extra on a win (self-draw or off a discard); if the dealer discards the winning tile, the dealer also pays the winner one extra tai." data-ja="親台 1台:親のアガリ(ツモ・ロン)は1台加算;親が放銃した場合も、アガリ手に1台多く支払う。" data-ko="친 타이 1대:친이 화료(쯔모·론)하면 1타이 추가;친이 방총해도 아가리에게 1타이 더 지불."></li>
      <li data-zh="連莊:莊家胡牌或流局(臭莊)→ 連莊,莊家不變、連莊次數 +1。" data-en="Streak: the dealer wins or a washout (draw) → dealer stays, streak +1." data-ja="連荘:親がアガるか流局(臭荘)→ 連荘、親はそのまま・連荘数 +1。" data-ko="연장:친이 화료하거나 유국(臭莊) → 연장, 친 유지·연장 횟수 +1."></li>
      <li data-zh="輪莊:閒家胡牌 → 莊家順時針換下家,連莊次數重置。" data-en="Rotation: a non-dealer win → the dealer passes to the next player clockwise, streak resets." data-ja="輪荘:子がアガる → 親は時計回りに次の家へ、連荘数リセット。" data-ko="윤장:자가 화료 → 친은 시계 방향 다음 사람으로, 연장 횟수 리셋."></li>
      <li data-zh="連莊拉莊台數 = 2N+1(N=連莊次數):連一=3 台、連二=5 台、連三=7 台…" data-en="Streak bonus = 2N+1 (N = streak count): 1st = 3 tai, 2nd = 5, 3rd = 7…" data-ja="連荘台 = 2N+1(N=連荘数):連一=3台、連二=5台、連三=7台…" data-ko="연장 타이 = 2N+1(N=연장 횟수):연1=3타이, 연2=5, 연3=7…"></li>
      <li data-zh="莊家放炮連莊台照算:莊家連莊中放炮,連莊台照算給胡家。" data-en="Dealer-discard streak still counts: if the dealer is on a streak and discards the winning tile, the streak tai is still paid to the winner." data-ja="親の放銃でも連荘台は計算:親が連荘中に放銃した場合も、連荘台はアガリ手に加算。" data-ko="친 방총에도 연장 타이 계산:친이 연장 중 방총하면 연장 타이도 아가리에게 계산."></li>
      <li data-zh="閒家自摸:莊家那份多付「莊家台1 + 連莊台照算」(無連莊多付1、連一多付3、連二多付5…)。" data-en="Non-dealer self-draw: the dealer's share pays extra dealer tai 1 + streak tai (no streak +1, 1st +3, 2nd +5…)." data-ja="子のツモ:親の分は「親台1 + 連荘台」を多く支払う(連荘なし+1、連一+3、連二+5…)。" data-ko="자의 쯔모:친 몫은 친 타이1 + 연장 타이를 더 지불(연장 없음 +1, 연1 +3, 연2 +5…)."></li>
    </ul>
    <h3 data-zh="二、花牌(台灣特色)" data-en="2. Flowers (a Taiwanese touch)" data-ja="二、花牌(台湾ならでは)" data-ko="2. 꽃패(대만 특색)"></h3>
    <ul>
      <li data-zh="共 8 張:春、夏、秋、冬、梅、蘭、竹、菊;摸到花自動補牌。" data-en="8 flowers: Spring, Summer, Autumn, Winter · Plum, Orchid, Bamboo, Chrysanthemum; drawing a flower draws again." data-ja="全8枚:春夏秋冬・梅蘭竹菊。花を引いたら自動で補充。" data-ko="총 8장:춘하추동·매란국죽;꽃을 뽑으면 자동 보충."></li>
      <li data-zh="正花(花牌台):拿到與座位風位對應的花,每張 +1 台。對應:東(梅春)、南(蘭夏)、西(竹秋)、北(菊冬)。" data-en="Seat flower: a flower matching your seat wind scores +1 each. East (Plum, Spring) · South (Orchid, Summer) · West (Bamboo, Autumn) · North (Chrysanthemum, Winter)." data-ja="正花(花牌台):自席の風位に対応する花1枚ごとに+1台。対応:東(梅・春)、南(蘭・夏)、西(竹・秋)、北(菊・冬)。" data-ko="정화(꽃패 타이):자리 바람에 맞는 꽃 장당 +1타이. 대응:동(매·춘), 남(란·하), 서(죽·추), 북(국·동)."></li>
      <li data-zh="八仙過海(花胡):集滿 8 張花直接花胡、算 8 台,三家支付。" data-en="Eight flowers (flower win): all 8 flowers = instant win, 8 tai, paid by all three." data-ja="八仙過海(花胡):花8枚を揃えると即花胡、8台、3人払い。" data-ko="팔선과해(화호):꽃 8장을 모으면 즉시 화호, 8타이, 3인 지불."></li>
    </ul>
    <h3 data-zh="三、台數表" data-en="3. Scoring table" data-ja="三、台数表" data-ko="3. 타이표"></h3>
    <p data-zh="屁胡(0 台):胡牌但無任何台種成立 = 0 台,只收底注(無基本台白送)。" data-en="Zero-tai win (屁胡): a winning hand with no scoring pattern = 0 tai, collects only the base (no free basic tai)." data-ja="屁胡(0台):役が何も成立しないアガリ = 0台、底のみ受け取り(基本台のサービスなし)。" data-ko="피후(0타이):어떤 역도 성립하지 않는 화료 = 0타이, 판돈(底)만 수령(기본 타이 없음)."></p>
    <p style="font-weight:800;color:var(--pri);margin:12px 0 2px" data-zh="1 台" data-en="1 tai" data-ja="1台" data-ko="1타이"></p>
    <ul>

<script>
var LANGS=['zh','en','ja','ko'];
var LNAMES={zh:'中文',en:'English',ja:'日本語',ko:'한국어'};
var TITLES={zh:'麻將16張',en:'MahJong 16',ja:'台湾麻雀 16張',ko:'타이완 16장 마작'};
function getLang(){
  try{ var v=localStorage.getItem('mj_lang'); if(v==='en'||v==='zh'||v==='ja'||v==='ko') return v; }catch(e){}
  try{ var ls=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||''];
    for(var i=0;i<ls.length;i++){ var t=(ls[i]||'').toLowerCase();
      if(t.indexOf('zh')===0) return 'zh';
      if(t.indexOf('ja')===0) return 'ja';
      if(t.indexOf('ko')===0) return 'ko';
    }
    if(ls.length&&ls[0]) return 'en';
  }catch(e){}
  return 'zh';
}
function applyLang(){
  var l=getLang(); document.documentElement.lang=(l==='zh'?'zh-Hant':l);
  var els=document.querySelectorAll('[data-zh]');
  for(var i=0;i<els.length;i++){
    var el=els[i]; var v=el.getAttribute('data-'+l);
    if(v===null) v=el.getAttribute('data-zh');
    if(v!==null) el.innerHTML=v;
  }
  var c=document.getElementById('langCur'); if(c) c.textContent=(LNAMES[l]||LNAMES.zh)+' ▾';
  var btns=document.querySelectorAll('#langMenu button');
  for(var j=0;j<btns.length;j++){ btns[j].className=(btns[j].getAttribute('data-l')===l)?'cur':''; }
  document.title=TITLES[l]||TITLES.zh;
}
function toggleLangMenu(e){ if(e&&e.stopPropagation) e.stopPropagation(); var m=document.getElementById('langMenu'); if(m) m.classList.toggle('on'); }
function pickLang(l){ try{ localStorage.setItem('mj_lang', l); }catch(e){} applyLang(); var m=document.getElementById('langMenu'); if(m) m.classList.remove('on'); }
document.addEventListener('click', function(){ var m=document.getElementById('langMenu'); if(m) m.classList.remove('on'); });
function openRules(){ document.getElementById('rulesMask').classList.add('on'); document.getElementById('rulesModal').classList.add('on'); }
function closeRules(){ document.getElementById('rulesMask').classList.remove('on'); document.getElementById('rulesModal').classList.remove('on'); }
applyLang();
</script>
